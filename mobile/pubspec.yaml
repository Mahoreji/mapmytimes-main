name: mapmytimes
description: MapMyTimes — Independent news platform. Journalism of Integrity. Mobile companion for iOS + Android (Flutter).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ----- HTTP & API ------
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  http_parser: ^4.1.2
  http: ^1.2.2

  # ----- Routing ------
  go_router: ^14.6.2

  # ----- State ------
  flutter_riverpod: ^2.6.1

  # ----- Images / Cache ------
  cached_network_image: ^3.4.1

  # ----- Shared Preferences (settings) ------
  shared_preferences: ^2.3.3

  # ----- Offline / Local cache ------
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.1

  # ----- Text-to-speech (listen to article) ------
  flutter_tts: ^4.2.0

  # ----- Utility ------
  intl: ^0.20.2
  collection: ^1.19.0
  url_launcher: ^6.3.1
  share_plus: ^10.0.3

  # ----- i18n strings ------
  slang: ^3.31.1
  slang_flutter: ^3.31.0

  # ----- Env ------
  envied: ^1.0.0
  flutter_dotenv: ^5.2.1

  # ----- Icons ------
  font_awesome_flutter: ^11.0.0
  google_fonts: ^6.2.1

  # ----- Video (Shorts) ------
  video_player: ^2.9.2
  chewie: ^1.8.5

  # ----- Pull to refresh / refresh indicator ------
  pull_to_refresh: ^2.0.0

  # ----- WebView (for article share/support page if needed ------
  webview_flutter: ^4.10.0

  # ----- Web Auth (OAuth redirects) ------
  flutter_web_auth_2: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  envied_generator: ^1.0.0
  slang_build_runner: ^3.31.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/launcher/
    - assets/.env
    - .env
