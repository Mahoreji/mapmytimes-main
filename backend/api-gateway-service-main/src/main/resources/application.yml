# ============================================================================
# MapMyTour API Gateway Configuration
# Version: 2.0.0 - Enhanced Enterprise Edition
# ============================================================================

server:
  port: ${SERVER_PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}  # Listen on all interfaces for Docker network access
  error:
    include-message: always
    include-binding-errors: always
    whitelabel:
      enabled: false  # Disable HTML error pages, always return JSON
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
    # Exclude WebSocket/streaming endpoints from compression
    # Compression breaks SockJS streaming transports
    exclude-paths: /auth/ws/**, /v3/api-docs/**, /swagger-ui/**

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:mapmytour-api-gateway}
  
  # Reactive R2DBC (Non-blocking) for logic
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:6432}/${DB_NAME:gateway_service}?prepareThreshold=0
    username: ${DB_USERNAME:admin_prod}
    password: ${DB_PASSWORD:MapMyTour@Prod885839!SuperSecure}
    pool:
      max-size: 20
      initial-size: 5
      max-idle-time: 30m

  # Flyway Migration Configuration
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:6432}/${DB_NAME:gateway_service}?prepareThreshold=0
    user: ${DB_USERNAME:admin_prod}
    password: ${DB_PASSWORD:MapMyTour@Prod885839!SuperSecure}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prod}
  
  # Reactor Netty HTTP Server Configuration
  reactor:
    netty:
      http:
        server:
          max-header-size: ${GATEWAY_MAX_HEADER_SIZE:65536}  # Increased from default 8192 to 64KB

  # Disable multipart processing in gateway - let downstream services handle it
  servlet:
    multipart:
      enabled: false
 
  # Swagger / OpenAPI documentation configuration
  springdoc:
    api-docs:
      path: /v3/api-docs
    swagger-ui:
      path: /swagger-ui.html
      operationsSorter: alpha
      tagsSorter: alpha
    webflux:
      ui-config:
        displayRequestDuration: true
    show-actuator: true
    group-configs:
      - group: Gateway-Security
        paths-to-match: /api/v1/admin/security/**
      - group: Gateway-Public
        paths-to-match: /api/v1/auth/**, /api/v1/user/**, /api/v1/bookings/**, /api/v1/tours/**, /api/v1/destinations/**, /api/v1/activities/**

  # ==================== CLOUD GATEWAY CONFIGURATION ====================
  cloud:
    gateway:
      # Exclude actuator endpoints from gateway routing - they should be handled directly by Spring Boot Actuator
      # This ensures /actuator/** endpoints work without being routed through the gateway
      # Actuator endpoints are automatically excluded from gateway routing in Spring Cloud Gateway
      # Global CORS Configuration - DISABLED to prevent duplicate headers
      # CORS is handled by CorsWebFilter bean in GatewayConfig.java
      # Having both causes duplicate Access-Control-Allow-Origin headers
      # globalcors:
      #   cors-configurations:
      #     '[/**]':
      #       allowedOriginPatterns:
      #         - "http://localhost:3000"
      #         - "http://localhost:3001"
      #         - "https://mapmytimes.com"
      #         - "https://www.mapmytimes.com"
      #         - "https://*.mapmytimes.com"
      #       allowedMethods:
      #         - GET
      #         - POST
      #         - PUT
      #         - DELETE
      #         - OPTIONS
      #         - PATCH
      #       allowedHeaders: "*"
      #       allowCredentials: true
      #       maxAge: 3600
      #       exposedHeaders:
      #         - X-Total-Count
      #         - X-Page-Count
      #         - X-Current-Page
      #         - X-Request-Id
      #         - X-RateLimit-Limit
      #         - X-RateLimit-Remaining
      #         - X-RateLimit-Reset
      #     # WebSocket-specific CORS for SockJS endpoint
      #     '[/auth/ws/**]':
      #       allowedOriginPatterns:
      #         - "http://localhost:3000"
      #         - "http://localhost:3001"
      #         - "https://mapmytimes.com"
      #         - "https://www.mapmytimes.com"
      #         - "https://*.mapmytimes.com"
      #       allowedMethods:
      #         - GET
      #         - POST
      #         - OPTIONS
      #       allowedHeaders: "*"
      #       allowCredentials: true
      #       maxAge: 3600

      # ==================== SERVICE ROUTES ====================
      routes:
        # WebSocket Route for Auth Service (Must come before other auth routes)
        - id: auth-websocket-apiv1
          uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
          order: 0
          predicates:
            - Path=/api/v1/auth/ws/**
          filters:
            - StripPrefix=0  # Proxy exactly as /api/v1/auth/ws/** since auth-service registers it
            - name: RemoveRequestHeader
              args:
                name: Origin
            - name: AddRequestHeader
              args:
                name: X-Request-Source
                value: api-gateway
            # Disable response buffering for SockJS streaming
            - name: SetResponseHeader
              args:
                name: X-Accel-Buffering
                value: "no"
            # Disable compression for streaming 
            - name: RemoveResponseHeader
              args:
                name: Content-Encoding
            - name: PreserveHostHeader

        - id: auth-websocket
          uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
          order: 0
          predicates:
            - Path=/auth/ws/**
          filters:
            - StripPrefix=1  # Remove /auth prefix, forward /ws/** to auth-service
            - name: RemoveRequestHeader
              args:
                name: Origin
            - name: AddRequestHeader
              args:
                name: X-Request-Source
                value: api-gateway
            # Disable response buffering for SockJS streaming
            - name: SetResponseHeader
              args:
                name: X-Accel-Buffering
                value: "no"
            # Disable compression for streaming (compression breaks SockJS streaming)
            - name: RemoveResponseHeader
              args:
                name: Content-Encoding
            # Preserve host header for proper routing
            - name: PreserveHostHeader
            # NO RETRY for WebSocket - streaming connections should not be retried
            # Retry breaks long-lived streaming connections
        
        # OAuth2 Spring Security Endpoints (Must come before other auth routes)
        - id: auth-oauth2-endpoints
          uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
          order: 1
          predicates:
            - Path=/oauth2/**
          filters:
            - StripPrefix=0
            - name: RemoveRequestHeader
              args:
                name: Origin
            - name: AddRequestHeader
              args:
                name: X-Request-Source
                value: api-gateway
          
        # Auth & User Service Routes (Combined)
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
          order: 10
          predicates:
          - Path=/api/v1/auth/**,/api/v1/user/**,/api/v1/super-admin/**,/api/v1/circles/**,/api/v1/attribution/**
          filters:
            - StripPrefix=0
            - name: RemoveRequestHeader
              args:
                name: Origin
            - name: AddRequestHeader
              args:
                name: X-Request-Source
                value: api-gateway
            # Temporarily disable CircuitBreaker for auth-service to debug send-otp timeout/503
            # - name: CircuitBreaker
            #   args:
            #     name: auth-service-cb
            #     fallbackUri: forward:/fallback/common
            - name: AuthenticationFilter
              args:
                excludeUrls:
                  # ================ AUTH SERVICE PUBLIC ENDPOINTS ================
                  # WebSocket Upgrade endpoints MUST completely bypass Authorization HTTP filter
                  - /api/v1/auth/ws/**

                  # Authentication & Registration
                  - /api/v1/auth/oauth2/**
                  - /api/v1/auth/register
                  - /api/v1/auth/register/agent
                  - /api/v1/auth/register/supplier
                  - /api/v1/auth/login
                  - /api/v1/auth/send-otp
                  - /api/v1/auth/login-otp
                  - /api/v1/auth/refresh
                  - /api/v1/auth/validate-token

                  # Password Management (Public)
                  - /api/v1/auth/forgot-password/step1
                  - /api/v1/auth/forgot-password/step2
                  - /api/v1/auth/reset-password
                  - /api/v1/auth/validate-password

                  # Email Verification (Public)
                  - /api/v1/auth/verify-email
                  - /api/v1/auth/resend-verification
                  - /api/v1/auth/send-verification-otp

                  # Two Factor Authentication (Verification only)
                  - /api/v1/auth/2fa/verify

                  # Account Management (Public queries)
                  - /api/v1/auth/check-email
                  - /api/v1/auth/account-status
                  - /api/v1/auth/reactivate
                  - /api/v1/auth/confirm-deletion

                  # Security & Monitoring (Public reporting)
                  - /api/v1/auth/security/report
                  - /api/v1/auth/rate-limit

                  # Health check
                  - /api/v1/auth/health

                  # ================ USER SERVICE PUBLIC ENDPOINTS ===============
                  - /api/v1/user/profile/*/public
                  - /api/v1/user/search
                  - /api/v1/user/interests/available
                  - /api/v1/user/health
                  - /api/v1/user/upload-profile-image
                  - /api/v1/user/profile-image
                  - /api/v1/user/delete-profile-image
                  # - /api/v1/user/profile requires authentication (removed from public list)
                  - /api/v1/user/profile-image-info

        # Payment Service Routes - Critical Endpoints (No Circuit Breaker)
        # These endpoints must always work - Cashfree callbacks and success redirects
        - id: payment-service-critical
          uri: ${PAYMENT_SERVICE_URL:http://payment-service:8088}
          order: 1  # Higher priority - must come before general payment routes
          predicates:
            - Path=/api/v1/payment/cashfree/success,/api/v1/payment/cashfree/success/**,/api/v1/payment/cashfree/webhook,/api/v1/payment/cashfree/webhook/**,/api/v1/payment/cashfree/sync-payment/**
          filters:
            - StripPrefix=0
            - name: RemoveRequestHeader
              args:
                name: Origin
            - name: AddRequestHeader
              args:
                name: X-Request-Source
                value: api-gateway
            - name: Retry
              args:
                retries: 5  # More retries for critical endpoints
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
                methods: GET,POST
                backoff:
                  firstBackoff: 1s
                  maxBackoff: 5s
                  factor: 2
                  basedOnPreviousValue: false
            # NO CircuitBreaker for critical endpoints - they must always reach the service
            - name: AuthenticationFilter
              args:
                excludeUrls:
                  - /api/v1/payment/cashfree/webhook/**
                  - /api/v1/payment/cashfree/success
                  - /api/v1/payment/cashfree/success/**
                  - /api/v1/payment/cashfree/sync-payment/**

        # Payment Service Routes - Main API
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URL:http://payment-service:8088}
          order: 2
          predicates:
            - Path=/api/v1/payment/**
          filters:
            - StripPrefix=0
            - name: RemoveRequestHeader
              args:
                name: Origin
            - name: AddRequestHeader
              args:
                name: X-Request-Source
                value: api-gateway
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
                methods: GET,POST
                backoff:
                  firstBackoff: 500ms
                  maxBackoff: 2s
                  factor: 2
                  basedOnPreviousValue: false
            - name: CircuitBreaker
              args:
                name: payment-service-cb
                fallbackUri: forward:/fallback/payment
            - name: AuthenticationFilter
              args:
                excludeUrls:
                  - /api/v1/payment/health
                  - /api/v1/payment/health/**
                  - /api/v1/payment/docs/**
                  - /api/v1/payment/redoc/**
                  - /api/v1/payment/cashfree/webhook/**
                  - /api/v1/payment/cashfree/success
                  - /api/v1/payment/cashfree/success/**
                  - /api/v1/payment/cashfree/sync-payment/**
                  - /health
                  - /health/**

        # Payment Service Routes - Legacy Endpoints
        - id: payment-service-legacy-users
          uri: ${PAYMENT_SERVICE_URL:http://payment-service:8088}
          order: 2
          predicates:
            - Path=/users/payments/**
          filters:
            - StripPrefix=0
            - name: RemoveRequestHeader
              args:
                name: Origin
            - name: AddRequestHeader
              args:
                name: X-Request-Source
                value: api-gateway
            - name: CircuitBreaker
              args:
                name: payment-service-cb
                fallbackUri: forward:/fallback/payment
            - name: AuthenticationFilter
              args: {}
              
        - id: payment-service-legacy-bookings
          uri: ${PAYMENT_SERVICE_URL:http://payment-service:8088}
          order: 2
          predicates:
            - Path=/bookings/**
          filters:
            - StripPrefix=0
            - name: RemoveRequestHeader
              args:
                name: Origin
            - name: AddRequestHeader
              args:
                name: X-Request-Source
                value: api-gateway
            - name: CircuitBreaker
              args:
                name: payment-service-cb
                fallbackUri: forward:/fallback/payment
            - name: AuthenticationFilter
              args: {}

        # Booking Service Routes - Main Booking Endpoints
        - id: booking-service
          uri: ${BOOKING_SERVICE_URL:http://booking-service:8089}
          order: 3
          predicates:
            - Path=/api/v1/bookings/**
          filters:
            - StripPrefix=0
            - name: RemoveRequestHeader
              args:
                name: Origin
            - name: AddRequestHeader
              args:
                name: X-Request-Source
                value: api-gateway
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY,SERVICE_UNAVAILABLE,GATEWAY_TIMEOUT,INTERNAL_SERVER_ERROR
                methods: GET,POST,PUT,DELETE
                backoff:
                  firstBackoff: 200ms
                  maxBackoff: 1s
                  factor: 2
                  basedOnPreviousValue: false
            - name: CircuitBreaker
              args:
                name: booking-service-cb
                fallbackUri: forward:/fallback/bookings
            - name: AuthenticationFilter
              args:
                excludeUrls:
                  # Public endpoints (no authentication required)
                  - /api/v1/bookings/public/**
                  - /api/v1/bookings/availability/**
                  - /api/v1/bookings/pricing/**
                  # Attribution tracking (may be called from frontend without auth)
                  - /api/v1/bookings/attribution/track
                  # Public coupon endpoints (if any)
                  - /api/v1/bookings/coupons/public/**
                  # Ticket generation and download
                  - /api/v1/bookings/ticket/generate
                  - /api/v1/bookings/ticket/download/**
                  # Note: Service-to-service endpoints are handled in AuthenticationFilter code
                  # (added to PUBLIC_ENDPOINTS list to avoid YAML parsing issues)

        # Ticket Service Routes (Routed to Booking Service)
        - id: ticket-service
          uri: ${BOOKING_SERVICE_URL:http://booking-service:8089}
          order: 3
          predicates:
            - Path=/api/v1/bookings/ticket/**
          filters:
            - StripPrefix=0
            - name: RemoveRequestHeader
              args:
                name: Origin
            - name: AddRequestHeader
              args:
                name: X-Request-Source
                value: api-gateway
            - name: AuthenticationFilter
              args:
                excludeUrls:
                  - /api/v1/bookings/ticket/download/**
                  - /api/v1/bookings/ticket/generate

        # Booking Service Routes - Analytics Endpoints
        - id: booking-service-analytics
          uri: ${BOOKING_SERVICE_URL:http://booking-service:8089}
          order: 3
          predicates:
            - Path=/api/v1/analytics/**
          filters:
            - StripPrefix=0
            - name: RemoveRequestHeader
              args:
                name: Origin
            - name: AddRequestHeader
              args:
                name: X-Request-Source
                value: api-gateway
            - name: CircuitBreaker
              args:
                name: booking-service-cb
                fallbackUri: forward:/fallback/bookings
            - name: AuthenticationFilter
              # Analytics endpoints require authentication (Admin only, checked in service)

        # Travel Service Admin Routes (Higher priority - must come before auth-service)
        - id: travel-service-admin
          uri: ${TRAVEL_SERVICE_URL:http://travel-service:8085}
          order: 0
          predicates:
            - Path=/api/v1/admin/pricing/**,/api/v1/admin/financial/**
          filters:
            - StripPrefix=0
            - name: RemoveRequestHeader
              args:
                name: Origin
            - name: AddRequestHeader
              args:
                name: X-Request-Source
                value: api-gateway
            - name: CircuitBreaker
              args:
                name: travel-service-cb
                fallbackUri: forward:/fallback/travel
            - name: AuthenticationFilter

        # Travel Service Routes
        - id: travel-service
          uri: ${TRAVEL_SERVICE_URL:http://travel-service:8085}
          order: 4
          predicates:
            - Path=/api/v1/travel/**
          filters:
            - StripPrefix=0
            - name: RemoveRequestHeader
              args:
                name: Origin
            - name: AddRequestHeader
              args:
                name: X-Request-Source
                value: api-gateway
            - name: AddResponseHeader
              args:
                name: Connection
                value: keep-alive
            - name: CircuitBreaker
              args:
                name: travel-service-cb
                fallbackUri: forward:/fallback/travel
            - name: AuthenticationFilter
              args:
                excludeUrls:
                  # Flight endpoints - public (search, reference data, fare quotes, etc.)
                  - /api/v1/travel/flight/search
                  - /api/v1/travel/flight/calendar-fare
                  - /api/v1/travel/flight/fare-quote
                  - /api/v1/travel/flight/fare-rule
                  - /api/v1/travel/flight/hold-booking
                  - /api/v1/travel/flight/ssr
                  - /api/v1/travel/flight/seat-map
                  - /api/v1/travel/flight/cancellation-charges
                  - /api/v1/travel/flight/airlines
                  - /api/v1/travel/flight/airlines/**
                  - /api/v1/travel/flight/airports
                  - /api/v1/travel/flight/airports/**
                  # Bus endpoints - public (search, reference data)
                  - /api/v1/travel/bus/search
                  - /api/v1/travel/bus/seat-layout
                  - /api/v1/travel/bus/boarding-points
                  - /api/v1/travel/bus/origin-dest-mappings
                  - /api/v1/travel/bus/origin-dest-mappings/**
                  # Hotel endpoints - public (search, reference data)
                  - /api/v1/travel/hotel/search
                  - /api/v1/travel/hotel/info
                  - /api/v1/travel/hotel/rooms
                  - /api/v1/travel/hotel/city-codes
                  - /api/v1/travel/hotel/city-codes/**
                  # Booking and balance endpoints require authentication (NOT excluded - will require auth)


        # Reviews Service Routes
        - id: reviews-service
          uri: ${REVIEWS_SERVICE_URL:http://review-service:8087}
          order: 5
          predicates:
            - Path=/api/v1/reviews/**
          filters:
            - StripPrefix=0
            - name: RemoveRequestHeader
              args:
                name: Origin
            - name: CircuitBreaker
              args:
                name: reviews-service-cb
                fallbackUri: forward:/fallback/reviews
            - name: AuthenticationFilter
              args:
                excludeUrls:
                  - /api/v1/reviews/search
                  - /api/v1/reviews/entity/*/rating
                  - /api/v1/reviews/entity/*/stats
                  - /api/v1/reviews/entity/*/summary
                  - /api/v1/reviews/entity/*/top-rated
                  - /api/v1/reviews/trending
                  - /api/v1/reviews/recent
                  - /api/v1/reviews/entity/*

        # Blog Service Routes
        - id: blog-service
          uri: ${BLOG_SERVICE_URL:http://blog-service:8090}
          order: 6
          predicates:
            - Path=/api/v1/blog/**,/api/v1/social/**
          filters:
            - StripPrefix=0
            - name: RemoveRequestHeader
              args:
                name: Origin
            - name: AddRequestHeader
              args:
                name: X-Request-Source
                value: api-gateway
            - name: AddResponseHeader
              args:
                name: Connection
                value: keep-alive
            - name: CircuitBreaker
              args:
                name: blog-service-cb
                fallbackUri: forward:/fallback/blog
            - name: AuthenticationFilter
              args:
                excludeUrls:
                  # All GET endpoints are handled by AuthenticationFilter.isBlogGetRequest()
                  # These are kept for backward compatibility
                  - /api/v1/blog/posts
                  - /api/v1/blog/posts/**
                  - /api/v1/blog/categories
                  - /api/v1/blog/categories/**
                  - /api/v1/blog/tags
                  - /api/v1/blog/tags/**
                  - /api/v1/blog/comments
                  - /api/v1/blog/comments/**
                  - /api/v1/blog/likes
                  - /api/v1/blog/likes/**
                  - /api/v1/blog/media
                  - /api/v1/blog/media/**
                  - /api/v1/blog/settings
                  - /api/v1/blog/settings/**
                  - /api/v1/social/explore

        # Customer Support Service Routes
        - id: customer-support-service
          uri: ${CUSTOMER_SUPPORT_SERVICE_URL:http://customer-service:8086}
          order: 7
          predicates:
            - Path=/api/v1/customer/**,/api/v1/jobs/**,/api/v1/applications/**,/api/v1/admin/jobs/**,/api/v1/admin/applications/**
          filters:
            - StripPrefix=0
            - name: RemoveRequestHeader
              args:
                name: Origin
            - name: CircuitBreaker
              args:
                name: customer-support-service-cb
                fallbackUri: forward:/fallback/customer-support
            - name: AuthenticationFilter
              args:
                excludeUrls:
                  - /api/v1/customer/knowledge-base/search
                  - /api/v1/customer/knowledge-base/*/public
                  - /api/v1/customer/knowledge-base/categories
                  - /api/v1/customer/quote-requests/public/**
                  - /api/v1/customer/feedback/stats/public
                  - /api/v1/jobs/**

        # Hotel Service Routes (Public)
        - id: hotel-service-public
          uri: ${HOTEL_SERVICE_URL:http://hotel-service:8092}
          order: 8
          predicates:
            - Path=/api/v1/hotels/**
          filters:
            - StripPrefix=0
            - name: RemoveRequestHeader
              args:
                name: Origin
            - name: AddRequestHeader
              args:
                name: X-Request-Source
                value: api-gateway
            - name: CircuitBreaker
              args:
                name: hotel-service-cb
                fallbackUri: forward:/fallback/hotel
            - name: AuthenticationFilter
              args:
                excludeUrls:
                  # ALL hotel endpoints are public
                  - /api/v1/hotels/**

        # Hotel Service Routes (Admin)
        - id: hotel-service-admin
          uri: ${HOTEL_SERVICE_URL:http://hotel-service:8092}
          order: 0
          predicates:
            - Path=/api/v1/admin/hotels/**
          filters:
            - StripPrefix=0
            - name: RemoveRequestHeader
              args:
                name: Origin
            - name: AddRequestHeader
              args:
                name: X-Request-Source
                value: api-gateway
            - name: CircuitBreaker
              args:
                name: hotel-service-cb
                fallbackUri: forward:/fallback/hotel
            - name: AuthenticationFilter

        # Utils Service Routes
        - id: utils-service
          uri: ${UTILS_SERVICE_URL:http://utils-service:8082}
          order: 9
          predicates:
            - Path=/api/v1/utils/**
          filters:
            - StripPrefix=0
            - name: RemoveRequestHeader
              args:
                name: Origin
            - name: CircuitBreaker
              args:
                name: utils-service-cb
                fallbackUri: forward:/fallback/utils
            - name: AuthenticationFilter
              args:
                excludeUrls:
                  - /api/v1/utils/**

        # Core Service Routes - Tours
        - id: core-service-tours
          uri: ${CORE_SERVICE_URL:http://core-service:8083}
          order: 12
          predicates:
            - Path=/api/v1/tours/**
          filters:
            - StripPrefix=0
            - name: RemoveRequestHeader
              args:
                name: Origin
            - name: AddRequestHeader
              args:
                name: X-Request-Source
                value: api-gateway
            - name: CircuitBreaker
              args:
                name: core-service-cb
                fallbackUri: forward:/fallback/core
            - name: AuthenticationFilter
              args:
                excludeUrls:
                  - /api/v1/tours/**

        # Core Service Routes - Group Tours
        - id: core-service-group-tours
          uri: ${CORE_SERVICE_URL:http://core-service:8083}
          order: 12
          predicates:
            - Path=/api/v1/group-tours/**
          filters:
            - StripPrefix=0
            - name: RemoveRequestHeader
              args:
                name: Origin
            - name: AddRequestHeader
              args:
                name: X-Request-Source
                value: api-gateway
            - name: CircuitBreaker
              args:
                name: core-service-cb
                fallbackUri: forward:/fallback/core
            - name: AuthenticationFilter
              args:
                excludeUrls:
