# ==================== LOGGING CONFIGURATION ====================
logging:
  level:
    org.springframework.cloud.gateway: ${LOG_LEVEL_GATEWAY:DEBUG}
    org.springframework.cloud.gateway.handler.RoutePredicateHandlerMapping: DEBUG
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: DEBUG
    in.mapmytour.api: ${LOG_LEVEL_MAPMYTOUR:DEBUG}
    io.github.resilience4j: ${LOG_LEVEL_RESILIENCE4J:INFO}
    org.springframework.data.redis: INFO
    org.springframework.security: INFO
    reactor.netty: INFO
    ROOT: ${LOG_LEVEL_ROOT:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/api-gateway.log
    max-size: 100MB
    max-history: 30

# ==================== MANAGEMENT CONFIGURATION ====================
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics,prometheus,circuitbreakers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      groups:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    gateway:
      enabled: true
    prometheus:
      enabled: ${MANAGEMENT_METRICS_PROMETHEUS_ENABLED:true}
  metrics:
    export:
      prometheus:
        enabled: ${MANAGEMENT_METRICS_PROMETHEUS_ENABLED:true}
        step: 60s
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99
  # Tracing Configuration - Zipkin (optional)
  # Disable tracing by default to avoid connection refused errors to localhost:9411
  # Enable by setting ZIPKIN_ENDPOINT environment variable
  # Format: ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans
  # If ZIPKIN_ENDPOINT is not set, tracing is disabled (see TracingConfig.java)
  tracing:
    enabled: ${ZIPKIN_ENABLED:false}
    sampling:
      probability: ${ZIPKIN_SAMPLING_PROBABILITY:1.0}
  # Zipkin exporter endpoint
  # Set via ZIPKIN_ENDPOINT environment variable or leave empty to disable
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:}
  health:
    circuitbreakers:
      enabled: true
    redis:
      enabled: true
    ratelimiters:
      enabled: true
  info:
    env:
      enabled: true
    git:
      mode: full

# ==================== APPLICATION INFORMATION ====================
info:
  app:
    name: ${spring.application.name}
    description: "MapMyTour API Gateway - Enterprise Grade Microservices Gateway"
    version: ${VERSION:2.0.0}
    environment: ${ENVIRONMENT:development}
    build-number: ${BUILD_NUMBER:local}
  team:
    name: "MapMyTour Engineering"
    email: "engineering@mapmytimes.com"
  features:
    security: "JWT Authentication + RBAC"
    rate-limiting: "Redis-based distributed rate limiting"
    monitoring: "Prometheus + Circuit Breaker metrics"
    fault-tolerance: "Resilience4j Circuit Breaker + Retry"
    cors: "Multi-origin CORS support"

# ==================== CUSTOM APPLICATION PROPERTIES ====================
app:
  version: ${VERSION:2.0.0}
  environment: ${ENVIRONMENT:development}
  features:
    rate-limiting: ${RATE_LIMIT_ENABLED:false}
    circuit-breaker: true
    authentication: true
    cors: true
    monitoring: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,https://mapmytimes.com,https://www.mapmytimes.com}
  security:
    jwt:
      issuer: ${jwt.issuer}
    excluded-paths:
      - /actuator/**
      - /health
      - /fallback/**
      - /api/v1/auth/login
      - /api/v1/auth/register
      - /api/v1/tours/**
      - /api/v1/destinations/**
      - /api/v1/activities/**
      - /api/v1/adventures/**
      - /api/v1/reviews/**
      - /api/v1/blog/**
      - /api/v1/customer/**
      - /api/v1/ai/**
      - /api/v1/bookings/**
      - /api/v1/hotels/**
      - /api/v1/utils/**
      - /api/v1/calculator/calculate
      - /api/v1/calculator/vehicles/**
      - /api/v1/calculator/hotels/**
      - /api/v1/calculator/test/**
