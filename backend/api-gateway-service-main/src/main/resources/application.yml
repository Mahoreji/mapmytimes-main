      # Discovery Configuration - Enabled for Service Discovery
      discovery:
        locator:
          enabled: ${EUREKA_CLIENT_ENABLED:true}
          lower-case-service-id: true
          url-expression: "'https://'+serviceId"

      # HTTP Client Configuration for SSL/TLS and Connection Pooling
      httpclient:
        ssl:
          use-insecure-trust-manager: ${GATEWAY_SSL_INSECURE_TRUST:false}
          handshake-timeout: ${GATEWAY_SSL_HANDSHAKE_TIMEOUT:10000}
          close-notify-flush-timeout: ${GATEWAY_SSL_CLOSE_TIMEOUT:3000}
          close-notify-read-timeout: ${GATEWAY_SSL_READ_TIMEOUT:0}
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:10000}  # Increased to 10s for better connectivity
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:300s}  # Increased to 5 minutes for WebSocket streaming and long-lived connections
        max-header-size: ${GATEWAY_MAX_HEADER_SIZE:65536}  # Increased from default 8192 to 64KB for outbound requests
        pool:
          type: ${GATEWAY_POOL_TYPE:elastic}
          max-connections: ${GATEWAY_MAX_CONNECTIONS:1000}  # Optimized for heavy load
          max-idle-time: ${GATEWAY_MAX_IDLE_TIME:30s}
          max-life-time: ${GATEWAY_MAX_LIFE_TIME:300s}  # Increased to match response timeout for long-running requests
      # HTTP Server Configuration for incoming requests
      httpserver:
        max-header-size: ${GATEWAY_MAX_HEADER_SIZE:32768}  # Increased from default 8192 to 32KB (sufficient for most cases)
      # Preserve request body for PUT/PATCH requests (needed for multipart)
      preserve-host-header: false
      preserve-on-redirect: true

  # ==================== CODEC CONFIGURATION ====================
  # Increase max body size for file uploads (default is 256KB)
  codec:
    max-in-memory-size: ${GATEWAY_MAX_BODY_SIZE:200MB}

  # ==================== REDIS CONFIGURATION ====================
  data:
    redis:
      host: ${REDIS_HOST:150.241.245.162}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
      timeout: ${REDIS_TIMEOUT:2000ms}
#      ssl: ${REDIS_SSL:false}
      lettuce:
        pool:
          max-active: 50  # Optimized for heavy load
          max-idle: 20
          min-idle: 10
          max-wait: -1ms
        shutdown-timeout: 100ms

  # ==================== MAIN CONFIGURATION ====================
  main:
    allow-bean-definition-overriding: true
    web-application-type: reactive

# ==================== EUREKA CONFIGURATION ====================
# Eureka is disabled by default - services work without it using direct URLs
eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    register-with-eureka: ${EUREKA_REGISTER:false}
    fetch-registry: ${EUREKA_FETCH:false}
    service-url:
      defaultZone: ${EUREKA_SERVICE_URL:http://eureka-server:8761/eureka}
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 30
    lease-expiration-duration-in-seconds: 90
    instance-id: ${spring.application.name}:${spring.application.instance-id:${random.value}}

# ==================== JWT CONFIGURATION ====================
# JWT_SECRET is injected via env_file in docker-compose.yml (reads from .env)
# CRITICAL: jwt.secret MUST match the secret used by auth-service to sign tokens.
# If mismatch → gateway returns 401 TOKEN_INVALID on all authenticated endpoints.
# To find the correct value on the server: docker exec auth-service printenv JWT_SECRET
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:604800000} # 7 days
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days
  issuer: "auth-service"

# ==================== RATE LIMITING CONFIGURATION ====================
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:false}
  default:
    requests-per-minute: ${RATE_LIMIT_DEFAULT:100}
  auth:
    requests-per-minute: ${RATE_LIMIT_AUTH:50}
  payment:
    requests-per-minute: ${RATE_LIMIT_PAYMENT:30}
  booking:
    requests-per-minute: ${RATE_LIMIT_BOOKING:60}
  hotel:
    requests-per-minute: ${RATE_LIMIT_HOTEL:80}
  chat:
    requests-per-minute: ${RATE_LIMIT_CHAT:20}
  notification:
    requests-per-minute: ${RATE_LIMIT_NOTIFICATION:100}
  admin:
    requests-per-minute: ${RATE_LIMIT_ADMIN:200}
  public:
    requests-per-minute: ${RATE_LIMIT_PUBLIC:150}
  admin-login:
    requests-per-minute: ${RATE_LIMIT_ADMIN_LOGIN:5}        # Brute-force hard cap on /admin/login
  violation-ban-duration-minutes: ${RATE_LIMIT_VIOLATION_BAN_MINUTES:15}
  violation-ban-count: ${RATE_LIMIT_VIOLATION_BAN_COUNT:3}

# ── Security Platform ─────────────────────────────────────────────────────────
security:
  bot:
    ban-duration-hours: ${SECURITY_BOT_BAN_HOURS:24}
    scan-count-threshold: ${SECURITY_BOT_SCAN_THRESHOLD:15}
  threat:
    score-block-threshold: ${SECURITY_THREAT_BLOCK:70}
    score-challenge-threshold: ${SECURITY_THREAT_CHALLENGE:30}
  validation:
    max-content-length-bytes: ${SECURITY_MAX_BODY:209715200}  # 200 MB
    max-header-value-length: ${SECURITY_MAX_HEADER:8192}
  admin:
    ip-whitelist:
      enabled: ${ADMIN_IP_WHITELIST_ENABLED:true}
      allow-private-networks: ${ADMIN_ALLOW_PRIVATE_NETWORKS:false}
      default-ttl-days: ${ADMIN_WHITELIST_TTL:30}


# ==================== RESILIENCE4J CIRCUIT BREAKER CONFIGURATION ====================

# ==================== RESILIENCE4J CIRCUIT BREAKER CONFIGURATION ====================
resilience4j:
  circuitbreaker:
    instances:
      auth-service-cb:
        registerHealthIndicator: true
        slidingWindowSize: ${CB_SLIDING_WINDOW_SIZE:10}
        minimumNumberOfCalls: ${CB_MINIMUM_NUMBER_OF_CALLS:5}
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: ${CB_WAIT_DURATION_IN_OPEN_STATE:60s}
        failureRateThreshold: ${CB_FAILURE_RATE_THRESHOLD:50}
        eventConsumerBufferSize: 10
        slowCallRateThreshold: ${CB_SLOW_CALL_RATE_THRESHOLD:50}
        slowCallDurationThreshold: ${CB_SLOW_CALL_DURATION_THRESHOLD:8s}

      payment-service-cb:
        registerHealthIndicator: true
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
