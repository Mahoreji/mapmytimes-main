# ============================================================================
# MapMyTour API Gateway - Docker Compose Configuration
# ============================================================================
# This file demonstrates the Docker networking configuration for the API Gateway.
# In production, ensure all microservices are on the same Docker network.
# ============================================================================

version: '3.8'

services:
  api-gateway:
    container_name: api-gateway-service
    build:
      context: .
      dockerfile: Dockerfile
    image: mapmytour/api-gateway:latest
    ports:
      - "127.0.0.1:8080:8080" # Bind only to localhost for security - not publicly exposed
    networks:
      - mapmytour-network
    # Load secrets from .env file - this is the source of truth for JWT_SECRET and other credentials
    # All variables in .env are available as env vars inside the container
    env_file:
      - .env
    environment:
      # Server Configuration
      SERVER_PORT: 8080
      SERVER_ADDRESS: 0.0.0.0 # Listen on all interfaces for Docker network access (nginx connects via network)
      # Note: Do NOT set MANAGEMENT_SERVER_ADDRESS - actuator uses same address as server when on same port
      SPRING_PROFILES_ACTIVE: prod
      SPRING_APPLICATION_NAME: mapmytour-api-gateway

      # Production: Uses Docker container names for service discovery
      # Override default URLs (localhost) to use Docker container names on the same network
      # Note: All service URLs must match the Docker service names in your docker-compose network
      AUTH_SERVICE_URL: http://auth-service:8081 # Note: Comment mentions 'new-auth-service', but using 'auth-service' to match actual container name
      BOOKING_SERVICE_URL: http://booking-service:8089
      PAYMENT_SERVICE_URL: http://payment-service:8088
      CORE_SERVICE_URL: http://core-service:8083
      TRAVEL_SERVICE_URL: http://travel-service:8085
      REVIEWS_SERVICE_URL: http://review-service:8087
      BLOG_SERVICE_URL: http://blog-service:8090
      CUSTOMER_SUPPORT_SERVICE_URL: http://customer-service:8086
      UTILS_SERVICE_URL: http://utils-service:8082
      CHAT_SERVICE_URL: http://chat-service:8084
      HOTEL_SERVICE_URL: http://hotel-service:8092
      SUPPLIER_SERVICE_URL: http://supplier-service:8093
      EMPLOYEE_SERVICE_URL: http://employee-service:8094
      DOCUMENT_SERVICE_URL: http://document-service:8095
      NOTIFICATION_SERVICE_URL: http://notification-service:9090
      AGENT_SERVICE_URL: http://agent-service:8103
      LEAD_SERVICE_URL: ${LEAD_SERVICE_URL:-http://lead-service:8100}
      GST_SERVICE_URL: http://accounting-gst-service:8098
      FRAUD_SERVICE_URL: http://fraud-detection-service:8099
      AUDIT_SERVICE_URL: http://audit-log-service:8100
      REPORT_SERVICE_URL: http://report-analytics-service:8101
      GROUP_BOOKING_SERVICE_URL: http://group-booking-service:8102
      CORPORATE_TRAVEL_SERVICE_URL: http://corporate-travel-service:8103

      # Redis Configuration (if needed)
      REDIS_HOST: ${REDIS_HOST:-150.241.245.162}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}

      # JWT Configuration
      # JWT_SECRET is loaded from .env file via env_file directive above
      # The env_file ensures the same secret is used as auth-service
      # If you need to override: set JWT_SECRET explicitly here or update the .env file
      JWT_SECRET: ${JWT_SECRET}

      # Logging
      LOG_LEVEL_ROOT: INFO
      LOG_LEVEL_GATEWAY: INFO
      LOG_LEVEL_MAPMYTOUR: INFO

      # Circuit Breaker Timeouts (Production optimized)
      CB_PAYMENT_TIMEOUT: 30s # Increased for Cashfree API calls
      CB_BOOKING_TIMEOUT: 15s
      CB_AUTH_TIMEOUT: 60s

      # Gateway HTTP Client Timeouts
      GATEWAY_CONNECT_TIMEOUT: 5000
      GATEWAY_RESPONSE_TIMEOUT: 30s # Increased for payment service Cashfree API calls
      GATEWAY_MAX_HEADER_SIZE: 65536
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health/liveness" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    depends_on:
      # Add dependencies if needed (optional - gateway will handle service unavailability via circuit breakers)
      - redis
    volumes:
      - ./logs:/app/logs

  # Example: Redis service (if running locally)
  redis:
    container_name: redis
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379" # Bind only to localhost for security
    networks:
      - mapmytour-network
    command: redis-server --requirepass ${REDIS_PASSWORD}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  mapmytour-network:
    driver: bridge
    name: mapmytour-network

# ============================================================================
# IMPORTANT NOTES:
# ============================================================================
# 1. Container Names: All microservices must use the exact container names
#    specified in application.yml and match the Docker service names:
#    - auth-service:8081 (or new-auth-service if that's your actual container name)
#    - core-service:8083
#    - travel-service
#    - payment-service
#    - booking-service
#    - review-service
#    - blog-service
#    - customer-service
#    - utils-service
#    - ai-service
#    - hotel-service
#    - supplier-service
#    - employee-service
#    - document-service
#    - notification-service
#    - etc.
#
# 2. Network: All services must be on the same Docker network (mapmytour-network)
#
# 3. Environment Variables: In production, you typically DON'T need to set
#    service URL environment variables because the defaults in application.yml
#    use Docker container names. Only override if container names differ.
#
# 4. Local Development: For local development WITHOUT Docker, set environment
#    variables to use localhost URLs (see README.md for details).
# ============================================================================
