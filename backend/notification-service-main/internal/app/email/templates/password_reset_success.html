{{ define "content" }}
<!-- SAFE HERO SECTION -->
<tr>
  <td align="center" style="background-color: #0f172a; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); padding:45px 30px 52px; text-align:center;">
    <!-- BRAND LOGO PILL -->
    <div style="width:100%; margin-bottom:34px;">
      <div style="display:inline-block; background:#ffffff; padding:14px 28px; border-radius:999px; box-shadow:0 10px 25px rgba(0,0,0,0.2);">
        <img src="https://www.mapmytimes.com/logo.png"
             alt="MapMyTimes"
             width="240"
             style="display:block; max-width:240px; height:auto;">
      </div>
    </div>
    <div style="display:inline-block; background:#dcfce7; color:#166534; padding:8px 18px; border-radius:999px; font-size:13px; font-weight:800; letter-spacing:1px; margin-bottom:18px;">
      SUCCESS
    </div>
    <h1 style="margin:0; font-size:34px; line-height:42px; color:#ffffff; font-weight:900;">
      Password Updated
    </h1>
  </td>
</tr>
<!-- CONTENT -->
<tr>
  <td style="padding:34px 34px 30px; text-align:center;">
    <div style="margin-bottom:24px;">
        <div style="display:inline-block; background:#f0fdf4; border-radius:50%; padding:20px; margin-bottom:20px;">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </div>
    </div>
    <p style="margin:0 0 20px; font-size:17px; color:#475569; line-height:1.6;">
      Your password has been reset successfully.
    </p>
    <p style="margin:0 0 30px; font-size:16px; color:#64748b; line-height:1.6;">
      If you did not make this change, please contact our support team immediately to secure your account.
    </p>

    <div style="margin:30px 0;">
      <a href="https://www.mapmytimes.com/login"
         style="display:inline-block; background:#0f172a; color:#ffffff; text-decoration:none; padding:17px 42px; border-radius:12px; font-size:18px; font-weight:900;">
        Sign In to Your Account →
      </a>
    </div>

    <div style="margin-top:40px; padding-top:20px; border-top:1px solid #f1f5f9; text-align:left;">
      <p style="margin:0; font-size:14px; color:#64748b;">Best Regards,</p>
      <p style="margin:5px 0 0; font-size:15px; font-weight:800; color:#0f172a;">MapMyTimes Security Team</p>
    </div>
  </td>
</tr>
{{ end }}
