{{ define "content" }}
<!-- SAFE HERO SECTION -->
<tr>
  <td align="center" style="background-color: #0f172a; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); padding:45px 30px 52px; text-align:center;">
    <!-- BRAND LOGO PILL -->
    <div style="width:100%; margin-bottom:34px;">
      <div style="display:inline-block; background:#ffffff; padding:14px 28px; border-radius:999px; box-shadow:0 10px 25px rgba(0,0,0,0.2);">
        <img src="https://www.mapmytour.in/logo.png"
             alt="Map My Tour"
             width="240"
             style="display:block; max-width:240px; height:auto;">
      </div>
    </div>
    <div style="display:inline-block; background:#fee2e2; color:#dc2626; padding:8px 18px; border-radius:999px; font-size:13px; font-weight:800; letter-spacing:1px; margin-bottom:18px;">
      NEW INQUIRY
    </div>
    <h1 style="margin:0; font-size:34px; line-height:42px; color:#ffffff; font-weight:900;">
      Contact Form Submission
    </h1>
  </td>
</tr>
<!-- CONTENT -->
<tr>
  <td style="padding:34px 34px 10px;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e7eb; border-radius:18px; overflow:hidden; background:#ffffff;">
      <tr>
        <td width="50%" style="padding:20px 24px; border-bottom:1px solid #eef2f7; border-right:1px solid #eef2f7;">
          <p style="margin:0 0 5px; font-size:13px; color:#64748b; font-weight:700;">Name</p>
          <p style="margin:0; font-size:17px; color:#0f172a; font-weight:800;">{{ .Name }}</p>
        </td>
        <td width="50%" style="padding:20px 24px; border-bottom:1px solid #eef2f7;">
          <p style="margin:0 0 5px; font-size:13px; color:#64748b; font-weight:700;">Email</p>
          <p style="margin:0; font-size:17px; color:#e11d48; font-weight:800;">{{ .Email }}</p>
        </td>
      </tr>
      {{ if .Phone }}
      <tr>
        <td colspan="2" style="padding:20px 24px; border-bottom:1px solid #eef2f7;">
          <p style="margin:0 0 5px; font-size:13px; color:#64748b; font-weight:700;">Phone</p>
          <p style="margin:0; font-size:17px; color:#0f172a; font-weight:800;">{{ .Phone }}</p>
        </td>
      </tr>
      {{ end }}
      <tr>
        <td colspan="2" style="padding:22px 24px; background:#f8fafc;">
          <p style="margin:0 0 8px; font-size:13px; color:#64748b; font-weight:700;">Message</p>
          <p style="margin:0; font-size:15px; color:#475569; line-height:1.6;">
            {{ .Message | safeHTML }}
          </p>
        </td>
      </tr>
    </table>
  </td>
</tr>
<!-- CTA -->
<tr>
  <td align="center" style="padding:24px 34px 14px;">
    <a href="mailto:{{ .Email }}"
       style="display:inline-block; background:#0f172a; color:#ffffff; text-decoration:none; padding:17px 42px; border-radius:12px; font-size:18px; font-weight:900;">
      Reply to Customer →
    </a>
  </td>
</tr>
{{ end }}
