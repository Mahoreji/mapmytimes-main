{{ define "content" }}
<!-- SAFE HERO SECTION -->
<tr>
  <td align="center" style="background-color: #0f172a; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); padding:45px 30px 52px; text-align:center;">
    <!-- BRAND LOGO PILL -->
    <div style="width:100%; margin-bottom:34px;">
      <div style="display:inline-block; background:#ffffff; padding:14px 28px; border-radius:999px; box-shadow:0 10px 25px rgba(0,0,0,0.2);">
        <img src="https://www.mapmytimes.com/logo.png"
             alt="MapMyTimes"
             width="240"
             style="display:block; max-width:240px; height:auto;">
      </div>
    </div>
    <div style="display:inline-block; background:#dcfce7; color:#15803d; padding:8px 18px; border-radius:999px; font-size:13px; font-weight:800; letter-spacing:1px; margin-bottom:18px;">
      DOCUMENTS READY
    </div>
    <h1 style="margin:0; font-size:34px; line-height:42px; color:#ffffff; font-weight:900;">
      Your Travel Voucher is Ready
    </h1>
  </td>
</tr>
<!-- CONTENT -->
<tr>
  <td style="padding:34px 34px 10px;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e7eb; border-radius:18px; overflow:hidden; background:#ffffff;">
      <tr>
        <td colspan="2" style="padding:22px 24px; border-bottom:1px solid #eef2f7;">
          <p style="margin:0 0 5px; font-size:13px; color:#64748b; font-weight:700;">Booking ID</p>
          <p style="margin:0; font-size:18px; color:#0f172a; font-weight:800;">#{{ .BookingRef }}</p>
        </td>
      </tr>
      <tr>
        <td width="100%" style="padding:20px 24px; background:#f8fafc;">
          <p style="margin:0; font-size:16px; color:#475569; line-height:1.5;">
            Hi {{ .Name }}, your official travel documents for <strong>{{ .ServiceName }}</strong> are ready to download.
          </p>
        </td>
      </tr>
    </table>
  </td>
</tr>
<!-- CTA -->
<tr>
  <td align="center" style="padding:24px 34px 14px;">
    <a href="{{ .ActionUrl }}"
       style="display:inline-block; background:#e11d48; color:#ffffff; text-decoration:none; padding:17px 42px; border-radius:12px; font-size:18px; font-weight:900;">
      Download Voucher →
    </a>
  </td>
</tr>
{{ end }}
