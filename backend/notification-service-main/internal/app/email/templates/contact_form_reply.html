{{ define "content" }}
<!-- SAFE HERO SECTION -->
<tr>
  <td align="center" style="background-color: #0f172a; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); padding:45px 30px 52px; text-align:center;">
    <!-- BRAND LOGO PILL -->
    <div style="width:100%; margin-bottom:34px;">
      <div style="display:inline-block; background:#ffffff; padding:14px 28px; border-radius:999px; box-shadow:0 10px 25px rgba(0,0,0,0.2);">
        <img src="https://www.mapmytour.in/logo.png"
             alt="Map My Tour"
             width="240"
             style="display:block; max-width:240px; height:auto;">
      </div>
    </div>
    <div style="display:inline-block; background:#dbeafe; color:#1e40af; padding:8px 18px; border-radius:999px; font-size:13px; font-weight:800; letter-spacing:1px; margin-bottom:18px;">
      INQUIRY RECEIVED
    </div>
    <h1 style="margin:0; font-size:34px; line-height:42px; color:#ffffff; font-weight:900;">
      Thanks for Reaching Out!
    </h1>
  </td>
</tr>
<!-- CONTENT -->
<tr>
  <td style="padding:34px 34px 30px;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="border:1px solid #e5e7eb; border-radius:18px; overflow:hidden; background:#ffffff;">
      <tr>
        <td style="padding:22px 24px;">
          <p style="margin:0 0 15px; font-size:16px; color:#1e293b; line-height:1.6;">
            Hi {{ .Name }}, we have received your inquiry regarding <strong>{{ .Subject }}</strong>.
          </p>
          <div style="background:#f8fafc; padding:20px; border-radius:12px; border-left:4px solid #0f172a;">
            <p style="margin:0; font-size:15px; font-style:italic; color:#475569;">
              "{{ .Body }}"
            </p>
          </div>
          <p style="margin:20px 0 0; font-size:15px; color:#64748b; line-height:1.6;">
            Our team will review your message and get back to you as soon as possible.
          </p>
        </td>
      </tr>
    </table>
  </td>
</tr>
{{ end }}
