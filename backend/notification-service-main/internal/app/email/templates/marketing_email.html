{{ define "content" }}
<!-- SAFE HERO SECTION -->
<tr>
  <td align="center" style="background-color: #0f172a; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); padding:45px 30px 52px; text-align:center;">
    <!-- BRAND LOGO PILL -->
    <div style="width:100%; margin-bottom:34px;">
      <div style="display:inline-block; background:#ffffff; padding:14px 28px; border-radius:999px; box-shadow:0 10px 25px rgba(0,0,0,0.2);">
        <img src="https://www.mapmytimes.com/logo.png"
             alt="Map My Tour"
             width="240"
             style="display:block; max-width:240px; height:auto;">
      </div>
    </div>
    <div style="display:inline-block; background:#fef3c7; color:#92400e; padding:8px 18px; border-radius:999px; font-size:13px; font-weight:800; letter-spacing:1px; margin-bottom:18px;">
      EXCLUSIVE OFFER
    </div>
    <h1 style="margin:0; font-size:34px; line-height:42px; color:#ffffff; font-weight:900;">
      Special For You
    </h1>
  </td>
</tr>
<!-- CONTENT -->
<tr>
  <td style="padding:34px 34px 30px; text-align:center;">
    <h2 style="margin:0 0 20px; font-size:24px; color:#0f172a; font-weight:900;">{{ .Title }}</h2>
    <p style="margin:0 0 30px; font-size:17px; color:#475569; line-height:1.6;">
      {{ .Body }}
    </p>

    <div style="margin:30px 0;">
      <a href="{{ .ActionUrl }}"
         style="display:inline-block; background:#e11d48; color:#ffffff; text-decoration:none; padding:17px 42px; border-radius:12px; font-size:18px; font-weight:900;">
        Claim Your Offer →
      </a>
    </div>

    <div style="margin-top:40px; padding-top:20px; border-top:1px solid #f1f5f9; text-align:left;">
      <p style="margin:0; font-size:14px; color:#64748b;">Warm Regards,</p>
      <p style="margin:5px 0 0; font-size:15px; font-weight:800; color:#0f172a;">Map My Tour Team</p>
    </div>
  </td>
</tr>
{{ end }}
