{{ define "content" }}
<!-- PREMIUM HERO SECTION WITH GRADIENT -->
<tr>
  <td align="center" style="background-color: #0f172a; background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); padding:45px 30px 52px; text-align:center;">
    <!-- BRAND LOGO PILL -->
    <div style="width:100%; margin-bottom:34px;">
      <div style="display:inline-block; background:#ffffff; padding:14px 28px; border-radius:999px; box-shadow:0 10px 25px rgba(0,0,0,0.2);">
        <img src="https://www.mapmytimes.com/logo.png"
             alt="MapMyTimes"
             width="240"
             style="display:block; max-width:240px; height:auto;">
      </div>
    </div>
    

    <!-- STATUS BADGE -->
    <div style="display:inline-block; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#ffffff; padding:8px 20px; border-radius:999px; font-size:12px; font-weight:800; letter-spacing:2px; margin-bottom:24px; text-transform:uppercase;">
      Booking Confirmed
    </div>

    <!-- MAIN TITLE -->
    <h1 style="margin:0 0 12px; font-size:36px; line-height:44px; color:#ffffff; font-weight:900; letter-spacing:-1px;">
      Your Trip to {{ .ServiceName }}<br>is Confirmed
    </h1>

    <!-- DATE SUBTITLE -->
    <p style="margin:0; font-size:18px; color:#94a3b8; font-weight:500; letter-spacing:0.5px;">
      {{ .BookingDate }}
    </p>
  </td>
</tr>

<!-- CONTENT SECTION -->
<tr>
  <td style="padding:40px 34px 10px;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff; border:1px solid #f1f5f9; border-radius:24px; box-shadow:0 4px 6px -1px rgba(0,0,0,0.05);">
      <tr>
        <td style="padding:28px 30px;">
          <h3 style="margin:0 0 20px; font-size:18px; color:#0f172a; font-weight:800;">Booking Summary</h3>
          
          <table width="100%" cellpadding="0" cellspacing="0" border="0">
            <tr>
              <td width="50%" style="padding:15px 0; border-bottom:1px solid #f1f5f9;">
                <p style="margin:0 0 4px; font-size:12px; color:#64748b; font-weight:700; text-transform:uppercase; letter-spacing:1px;">Booking Reference</p>
                <p style="margin:0; font-size:16px; color:#0f172a; font-weight:800;">#{{ .BookingRef }}</p>
              </td>
              <td width="50%" style="padding:15px 0; border-bottom:1px solid #f1f5f9; text-align:right;">
                <p style="margin:0 0 4px; font-size:12px; color:#64748b; font-weight:700; text-transform:uppercase; letter-spacing:1px;">Amount Paid</p>
                <p style="margin:0; font-size:16px; color:#e11d48; font-weight:800;">{{ .Currency }}{{ .Amount }}</p>
              </td>
            </tr>
            <tr>
              <td colspan="2" style="padding:15px 0;">
                <p style="margin:0 0 4px; font-size:12px; color:#64748b; font-weight:700; text-transform:uppercase; letter-spacing:1px;">Guest Name</p>
                <p style="margin:0; font-size:16px; color:#0f172a; font-weight:700;">{{ .Name }}</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </td>
</tr>

<!-- CTA -->
<tr>
  <td align="center" style="padding:30px 34px 40px;">
    <a href="{{ .ActionUrl }}"
       style="display:inline-block; background:#0f172a; color:#ffffff; text-decoration:none; padding:18px 45px; border-radius:14px; font-size:18px; font-weight:900; box-shadow:0 10px 20px rgba(15,23,42,0.2);">
      Manage Your Booking →
    </a>
  </td>
</tr>
{{ end }}
