# Application Configuration
spring.application.name=blog-service
spring.autoconfigure.exclude=
server.port=${SERVER_PORT:8090}
server.address=0.0.0.0
# Gateway-only access: Only allow requests from API Gateway (checks X-Request-Source header)
# For local development (mobile PWA + frontend direct calls without API gateway): disable gateway-only mode.
app.security.gateway-only.enabled=false

# Error Handling Configuration - Always return JSON, never HTML (matches API Gateway)
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false
# Compression enabled (matches API Gateway)
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain

# Database Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.main.allow-bean-definition-overriding=true

# Enterprise-Grade HikariCP Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=3000

# JPA Configuration - Production safe
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# spring.jpa.properties.hibernate.hbm2ddl.schema-validation=validate

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.table=blog_schema_history

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB
spring.servlet.multipart.file-size-threshold=2KB
server.tomcat.max-part-count=${TOMCAT_MAX_PART_COUNT:200}

# AWS S3 Configuration
aws.s3.access-key=${AWS_ACCESS_KEY}
aws.s3.secret-key=${AWS_SECRET_KEY}
aws.s3.region=${AWS_REGION:ap-south-1}
aws.s3.bucket-name=${AWS_S3_BUCKET:mapnytimes}

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Twilio Configuration
twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.phone-number=${TWILIO_PHONE_NUMBER:+12313103251}
twilio.whatsapp-number=${TWILIO_WHATSAPP_NUMBER:whatsapp:+14155238886}

# Redis Configuration for caching and session management
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=0

# Logging Configuration
logging.level.in.mapmytour.auth=DEBUG
logging.level.in.mapmytour.blog=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate=WARN
logging.level.com.amazonaws=WARN
logging.level.com.twilio=INFO
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.apache.kafka=ERROR
logging.level.org.springframework.kafka=ERROR
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.flywaydb=DEBUG

# Suppress Kafka and Eureka logs for cleaner startup
logging.level.org.apache.kafka=OFF
logging.level.org.springframework.kafka=OFF
logging.level.com.netflix.discovery=OFF
logging.level.com.netflix.eureka=OFF
logging.level.org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration=OFF

# Log file configuration
logging.file.name=logs/blog-service.log
logging.logback.rollingpolicy.file-name-pattern=logs/blog-service-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# Application specific properties
app.name=MapMyTimes Blog Service
app.version=${APP_VERSION:1.0.0}
app.description=MapMyTimes News & Blog Platform
app.timezone=Asia/Kolkata
# Production URL (used by API Gateway)
app.production.url=${BLOG_SERVICE_URL:http://172.17.0.1:8090}
# API Gateway integration
app.gateway.header=X-Request-Source
app.gateway.header.value=api-gateway

# Internal Service URLs
app.auth-service.url=${AUTH_SERVICE_URL}

# CORS Configuration (must match API Gateway CORS settings)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173,http://localhost:5174,http://localhost:5555,http://localhost:8080,https://mapmytimes.com,https://www.mapmytimes.com,https://*.mapmytimes.com}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# API Rate Limiting
app.rate-limit.requests-per-minute=200

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# Async Configuration
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=10
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=mapmytimes-async-

# Management and Monitoring (for API Gateway health checks)
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,info,metrics,prometheus}
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_SHOW_DETAILS:when-authorized}
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
management.prometheus.metrics.export.enabled=true
# Health check endpoint for API Gateway circuit breaker
management.endpoint.health.probes.enabled=true

# ==================== KAFKA MESSAGE QUEUE CONFIGURATION ====================
# Kafka Bootstrap Servers
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=${spring.application.name}-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
# Trust all packages for JSON deserialization (for consumers)
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# Add type information to JSON messages
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.batch-size=16384
spring.kafka.producer.buffer-memory=33554432
# Kafka connection timeout settings (prevent blocking)
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.max.block.ms=1000
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.concurrency=3

# Profile-specific banner
spring.banner.location=classpath:banner.txt

# JWT Configuration (must match auth service)
jwt.secret=${jwt.secret.key}
jwt.secret.key=${JWT_SECRET_KEY:${JWT_SECRET:${GATEWAY_JWT_SECRET}}}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.issuer=${JWT_ISSUER:auth-service}
