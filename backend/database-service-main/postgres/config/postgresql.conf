# =======================================================================
# MapMyTour — PostgreSQL Enterprise Configuration (OTA Hardened)
# =======================================================================

# Memory
shared_buffers = 512MB
effective_cache_size = 2GB          # 75% of total server RAM
work_mem = 32MB                     # Per sort/hash operation — OTA needs this for search JOINs
maintenance_work_mem = 256MB        # For VACUUM, CREATE INDEX
wal_buffers = 64MB

# WAL
wal_level = replica
max_wal_size = 4GB
min_wal_size = 512MB
wal_compression = on                # Reduces WAL size 40-60% — critical with every-minute backups
checkpoint_completion_target = 0.9
checkpoint_timeout = 10min

# Query planning
random_page_cost = 1.1              # SSDs — tells planner to prefer index scans
effective_io_concurrency = 200      # SSDs — parallel I/O
default_statistics_target = 200     # More statistics = better query plans

# Connections
max_connections = 500
superuser_reserved_connections = 5

# Autovacuum — tuned for OTA high-churn tables
autovacuum = on
autovacuum_max_workers = 4          # More workers for high-churn
autovacuum_naptime = 15s            # Check every 15s instead of default 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.01   # Vacuum when 1% of rows are dead (not 20%)
autovacuum_analyze_scale_factor = 0.005 # Analyze when 0.5% changed
autovacuum_vacuum_cost_delay = 2ms  # Less throttling for fast vacuum
autovacuum_cost_limit = 400         # Higher cost limit

# Timeouts — CRITICAL for OTA booking flows
statement_timeout = 30000           # Kill queries running > 30 seconds
lock_timeout = 5000                 # Fail fast on lock wait > 5 seconds (prevents booking deadlock cascade)
idle_in_transaction_session_timeout = 60000  # Kill idle transactions > 1 minute
deadlock_detection_timeout = 1s

# Logging — needed for performance debugging
log_min_duration_statement = 1000   # Log queries > 1 second
log_checkpoints = on
log_connections = off               # Too noisy with connection pool
log_disconnections = off
log_lock_waits = on                 # Critical for diagnosing booking flow issues
log_temp_files = 0                  # Log all temp file usage (indicates work_mem too small)
log_autovacuum_min_duration = 250ms # Log slow vacuum runs
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# Parallel query — for analytics queries
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# Monitoring & Background Tasks (Enterprise)
shared_preload_libraries = 'pg_stat_statements,pg_cron,pgaudit'
pg_stat_statements.track = 'all'
pg_stat_statements.max = 10000
pg_stat_statements.track_utility = on
cron.database_name = 'mapmytour_prod'

# pgAudit Configuration
pgaudit.log = 'all, -read'          # Log all except SELECTs (for performance)
pgaudit.log_catalog = on
pgaudit.log_client = on
pgaudit.log_level = log
pgaudit.log_parameter = on
pgaudit.log_relation = on
pgaudit.log_statement_once = on

# SSL/TLS Configuration
ssl = on
ssl_cert_file = '/etc/ssl/cert.pem'
ssl_key_file = '/etc/ssl/key.pem'
# ssl_ca_file = '/etc/ssl/ca.pem'      # Enable for client cert auth
