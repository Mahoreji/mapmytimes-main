# Redis Configuration for MapMyTour Development Environment

# Basic Settings
port 6379
bind 0.0.0.0
protected-mode no

# Memory Management - Development Settings
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence Settings - More frequent saves for dev
save 300 10
save 60 1000
save 30 10000

# RDB Settings
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF Settings - Enabled for data safety
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Logging - More verbose for development
loglevel notice
logfile "/data/redis-dev.log"
syslog-enabled yes
syslog-ident redis-dev

# Performance Settings - Development optimized
tcp-keepalive 300
timeout 300
tcp-backlog 511
databases 16

# Client Settings
maxclients 100

# Slow Log - Track slow queries
slowlog-log-slower-than 10000
slowlog-max-len 128

# Development specific settings
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# Latency Monitoring
latency-monitor-threshold 100

# Memory Usage Tracking
maxmemory-samples 5

# Key Expiration
activerehashing yes

# Client Output Buffer Limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Hash Settings
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List Settings
list-max-ziplist-size -2
list-compress-depth 0

# Set Settings
set-max-intset-entries 512

# Sorted Set Settings
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog Settings
hll-sparse-max-bytes 3000

# Streams Settings
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active Rehashing
activerehashing yes

# AOF Rewrite Settings
aof-rewrite-incremental-fsync yes

# RDB-AOF Hybrid Persistence
aof-use-rdb-preamble yes
