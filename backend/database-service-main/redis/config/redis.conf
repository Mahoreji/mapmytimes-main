# Redis Configuration for MapMyTour

# Basic Settings
port 6379
bind 0.0.0.0
protected-mode no

# Memory Management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence
save 900 1
save 300 10
save 60 10000

# RDB Settings
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF Settings
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Logging
loglevel notice
logfile ""

# Performance
tcp-keepalive 300
timeout 0
tcp-backlog 511
