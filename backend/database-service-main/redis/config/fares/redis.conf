# Redis configuration for FARE HOLDS — OTA critical data
# This instance stores price locks that are legally binding commitments

port 6379
bind 0.0.0.0
protected-mode no
dir /data

# CRITICAL: NO eviction — fare holds must NEVER be evicted
maxmemory 256mb
# Returns error if full — NEVER silently lose fare holds
maxmemory-policy noeviction

# Persistence: both RDB and AOF with maximum durability
save 60 1
save 30 10
save 15 100

appendonly yes
appendfilename "appendonly-fares.aof"
# Sync every write to disk (slower but zero data loss)
appendfsync always
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 50
auto-aof-rewrite-min-size 32mb

# Keyspace notifications — Spring Boot listener triggers inventory release on expiry
# E=keyevent, x=expired
notify-keyspace-events "Ex"

# Logging
loglevel notice
logfile "/data/redis-fares.log"
syslog-enabled yes
syslog-ident redis-fares

# Performance
tcp-keepalive 60
timeout 0
# Limited — only booking service should connect here
maxclients 100
