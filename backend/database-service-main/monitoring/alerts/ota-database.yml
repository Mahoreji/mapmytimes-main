groups:
  - name: ota_critical
    interval: 30s
    rules:

      # Fare hold expiry processing lag — OTA CRITICAL
      - alert: FareHoldExpiryLag
        expr: |
          (
            SELECT COUNT(*) FROM fare_holds
            WHERE status = 'active' AND expires_at < NOW() - INTERVAL '2 minutes'
          ) > 0
        for: 2m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Fare holds not being expired — inventory leak risk"
          description: "{{ $value }} fare holds past expiry window. Inventory not being released."

      # PgBouncer client wait time
      - alert: PgBouncerClientWaitHigh
        expr: pgbouncer_pool_client_active_connections > 800
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PgBouncer nearing connection limit"

      # PostgreSQL replication lag
      - alert: ReplicationLagCritical
        expr: pg_replication_slots_confirmed_flush_lsn - pg_current_wal_lsn() < -10000000
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Replication lag > 10MB — replica is falling behind"

      # Lock wait duration — booking flow
      - alert: LockWaitTimeHigh
        expr: pg_locks_count{mode="ExclusiveLock"} > 20
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "High exclusive lock count — possible booking deadlock"

      # Redis fare-hold eviction (must be zero — any eviction is data loss)
      - alert: FareHoldRedisEviction
        expr: redis_evicted_keys_total{instance="redis-fares-prod:9121"} > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "CRITICAL: Fare hold Redis is evicting keys — legal liability"
          description: "Fare hold keys are being evicted. Check memory usage immediately."

      # Redis fare-hold memory approaching limit
      - alert: FareHoldRedisMemoryWarning
        expr: redis_memory_used_bytes{instance="redis-fares-prod:9121"} / redis_config_maxmemory{instance="redis-fares-prod:9121"} > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Fare hold Redis at 80% memory — increase maxmemory"

      # Availability cache hit rate
      - alert: AvailabilityCacheHitRateLow
        expr: rate(redis_keyspace_hits_total[5m]) / (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m])) < 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Search/availability cache hit rate below 80% — GDS being hammered"

      # PostgreSQL table bloat
      - alert: TableBloatHigh
        expr: pg_stat_user_tables_n_dead_tup{relname=~"bookings.*|fare_holds"} > 1000000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "High dead tuple count on {{ $labels.relname }} — autovacuum may be lagging"

      # Long-running queries
      - alert: LongRunningQuery
        expr: pg_stat_activity_max_tx_duration{state="active",usename!="postgres"} > 30
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Query running > 30s on {{ $labels.datname }}"

      # Booking table partition missing (would cause INSERT failure)
      - alert: BookingPartitionMissing
        expr: |
          pg_stat_user_tables_n_live_tup{relname=~"bookings_.*"} == 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "Booking partition may be missing — INSERT failures imminent"
