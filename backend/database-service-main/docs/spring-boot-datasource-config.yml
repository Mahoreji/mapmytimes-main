# ============================================================
# MapMyTour Spring Boot Database Configuration Template
# Apply to: application.yml (dev) and application-prod.yml (prod)
# ============================================================

spring:
  datasource:
    # PRIMARY — writes go through PgBouncer (transaction mode)
    # NEVER connect directly to port 5432 — always use PgBouncer
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:6432}/${DB_NAME:mapmytour_prod}?ApplicationName=${spring.application.name}&reWriteBatchedInserts=true&prepareThreshold=5&socketTimeout=30
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      # pool-size = (num_cores * 2) + 1 per service
      maximum-pool-size: ${DB_POOL_SIZE:9}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      idle-timeout: 600000              # 10 minutes
      max-lifetime: 1800000             # 30 minutes
      connection-timeout: 3000          # Fail fast: 3s to get a connection
      validation-timeout: 1000          # 1s to validate connection
      connection-test-query: SELECT 1   # Verify connection is alive
      leak-detection-threshold: 60000   # Alert if connection held > 60s
      pool-name: ${spring.application.name}-pool
      data-source-properties:
        prepareThreshold: 0             # Disable server-side prepared statements (PgBouncer compat)
        preparedStatementCacheQueries: 256
        tcpKeepAlive: true

  # READ REPLICA datasource — route read-only queries here
  datasource-replica:
    url: jdbc:postgresql://${DB_REPLICA_HOST:localhost}:${DB_REPLICA_PORT:5434}/${DB_NAME:mapmytour_prod}?ApplicationName=${spring.application.name}-replica&socketTimeout=30
    username: ${DB_REPLICA_USERNAME}
    password: ${DB_REPLICA_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_REPLICA_POOL_SIZE:5}
      minimum-idle: 1
      connection-test-query: SELECT 1
      pool-name: ${spring.application.name}-replica-pool
      data-source-properties:
        prepareThreshold: 0

  # Redis configuration
  data:
    redis:
      # General cache + sessions (port 6379)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
      connect-timeout: 1000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 2
          max-wait: 1000ms
        shutdown-timeout: 500ms

  # Fare holds Redis (port 6381 — separate instance, noeviction)
  redis-fares:
    host: ${REDIS_FARES_HOST:localhost}
    port: ${REDIS_FARES_PORT:6381}
    password: ${REDIS_FARES_PASSWORD}
    timeout: 2000ms

  # Flyway migrations
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mapmytour_prod}
    user: ${DB_FLYWAY_USER:admin_prod}
    password: ${DB_FLYWAY_PASSWORD}
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    out-of-order: false

# JPA / Hibernate settings
jpa:
  hibernate:
    ddl-auto: validate                  # NEVER use create/create-drop in prod
  show-sql: false
  properties:
    hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect
      default_batch_fetch_size: 20      # N+1 prevention
      jdbc:
        batch_size: 50                  # Batch inserts
        fetch_size: 100
      order_inserts: true
      order_updates: true
      connection:
        provider_disables_autocommit: true
      query:
        in_clause_parameter_padding: true
