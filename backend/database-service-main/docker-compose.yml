# Hardened Docker Compose for MapMyTour OTA Platform
# =======================================================================
# CRITICAL SAFETY WARNING:
# 1. This configuration uses BIND MOUNTS (./data/) for persistence.
# 2. Rebuilding images, containers, or reboots will NOT lose data.
# 3. Sensitive services are exposed to 0.0.0.0 for external application connectivity.
# 4. RabbitMQ is added for Celery distributed workers.
# 5. Flower monitoring added for task inspection.
# =======================================================================

services:

  # ==========================================================
  # PostgreSQL Development Environment
  # ==========================================================
  postgres-dev:
    build:
      context: ./postgres
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: dev

    container_name: mapmytour_postgres_dev

    environment:
      - POSTGRES_USER=${POSTGRES_DEV_USER}
      - POSTGRES_PASSWORD=${POSTGRES_DEV_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DEV_DB}
      - ENVIRONMENT=dev

    volumes:
      - ./data/postgres_dev:/var/lib/postgresql/data
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d:ro
      - ./postgres/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./backups/dev:/backups
      - ./ssl/cert.pem:/etc/ssl/cert.pem:ro
      - ./ssl/key.pem:/etc/ssl/key.pem:ro

    command: postgres -c config_file=/etc/postgresql/postgresql.conf

    ports:
      - "0.0.0.0:${POSTGRES_DEV_EXTERNAL_PORT}:5432"

    networks:
      - database_network

    mem_limit: 1g
    cpus: 1.0

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_DEV_USER} -d ${POSTGRES_DEV_DB}"
        ]
      interval: 15s
      timeout: 10s
      retries: 5

  # ==========================================================
  # PostgreSQL Production Environment
  # ==========================================================
  postgres-prod:
    build:
      context: ./postgres
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: prod

    container_name: mapmytour_postgres_prod

    environment:
      - POSTGRES_USER=${POSTGRES_PROD_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PROD_PASSWORD}
      - POSTGRES_DB=${POSTGRES_PROD_DB}
      - ENVIRONMENT=prod

    volumes:
      - ./data/postgres_prod:/var/lib/postgresql/data
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d:ro
      - ./postgres/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./backups/prod:/backups
      - ./ssl/cert.pem:/etc/ssl/cert.pem:ro
      - ./ssl/key.pem:/etc/ssl/key.pem:ro

    command: postgres -c config_file=/etc/postgresql/postgresql.conf

    ports:
      - "0.0.0.0:${POSTGRES_PROD_EXTERNAL_PORT}:5432"

    networks:
      - database_network

    mem_limit: 2g
    cpus: 2.0

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_PROD_USER} -d ${POSTGRES_PROD_DB}"
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ==========================================================
  # Redis Development Environment
  # ==========================================================
  redis-dev:
    build:
      context: ./redis
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: dev

    container_name: mapmytour_redis_dev

    environment:
      - REDIS_PASSWORD=${REDIS_DEV_PASSWORD}
      - ENVIRONMENT=dev

    volumes:
      - ./data/redis_dev:/data
      - ./redis/config/dev:/usr/local/etc/redis:ro
      - ./backups/dev:/backups

    ports:
      - "0.0.0.0:${REDIS_DEV_EXTERNAL_PORT}:6379"

    networks:
      - database_network

    mem_limit: 512m
    cpus: 0.5

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a ${REDIS_DEV_PASSWORD} ping | grep -q PONG"
        ]
      interval: 15s
      timeout: 5s
      retries: 3

  # ==========================================================
  # Redis Production Environment
  # ==========================================================
  redis-prod:
    build:
      context: ./redis
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: prod

    container_name: mapmytour_redis_prod

    environment:
      - REDIS_PASSWORD=${REDIS_PROD_PASSWORD}
      - ENVIRONMENT=prod

    volumes:
      - ./data/redis_prod:/data
      - ./redis/config/prod:/usr/local/etc/redis:ro
      - ./backups/prod:/backups

    ports:
      - "0.0.0.0:${REDIS_PROD_EXTERNAL_PORT}:6379"

    networks:
      - database_network

    mem_limit: 1500m
    cpus: 1.0

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a ${REDIS_PROD_PASSWORD} ping | grep -q PONG"
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================================
  # Redis Fare-Hold Critical Instance
  # ==========================================================
  redis-fareholder-prod:
    build:
      context: ./redis
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: prod

    container_name: mapmytour_redis_fares_prod

    environment:
      - REDIS_PASSWORD=${REDIS_FARES_PASSWORD}
      - ENVIRONMENT=prod_fares

    volumes:
      - ./data/redis_fares:/data
      - ./redis/config/fares:/usr/local/etc/redis:ro
      - ./backups/prod/redis-fares:/backups

    ports:
      - "0.0.0.0:${REDIS_FARES_PORT}:6379"

    networks:
      - database_network

    mem_limit: 512m
    cpus: 0.5

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a ${REDIS_FARES_PASSWORD} ping | grep -q PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 3

  # ==========================================================
  # RabbitMQ Message Broker
  # ==========================================================
  rabbitmq:
    image: rabbitmq:3-management

    container_name: mapmytour_rabbitmq

    hostname: rabbitmq

    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}

    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
      - ./backups/rabbitmq:/backups

    ports:
      - "0.0.0.0:5672:5672"
      - "0.0.0.0:15672:15672"

    networks:
      - database_network

    mem_limit: 1g
    cpus: 1.0

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ==========================================================
  # Celery Flower Monitoring Dashboard
  # ==========================================================
  flower:
    image: mher/flower

    container_name: mapmytour_flower

    command: >
      celery flower
      --broker=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672//

    ports:
      - "0.0.0.0:5555:5555"

    depends_on:
      - rabbitmq

    networks:
      - database_network

    mem_limit: 512m
    cpus: 0.5

    restart: unless-stopped

  # ==========================================================
  # Backup Manager Service
  # ==========================================================
  backup-manager:
    build:
      context: ./backup-manager
      dockerfile: Dockerfile

    container_name: mapmytour_backup_manager

    environment:
      - POSTGRES_DEV_USER=${POSTGRES_DEV_USER}
      - POSTGRES_DEV_PASSWORD=${POSTGRES_DEV_PASSWORD}
      - POSTGRES_PROD_USER=${POSTGRES_PROD_USER}
      - POSTGRES_PROD_PASSWORD=${POSTGRES_PROD_PASSWORD}
      - REDIS_DEV_PASSWORD=${REDIS_DEV_PASSWORD}
      - REDIS_PROD_PASSWORD=${REDIS_PROD_PASSWORD}
      - REDIS_FARES_PASSWORD=${REDIS_FARES_PASSWORD}

    volumes:
      - ./backups:/backups
      - ./backup-manager/logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - database_network

    mem_limit: 512m
    cpus: 0.5

    restart: unless-stopped

    depends_on:
      - postgres-prod
      - redis-prod
      - redis-fareholder-prod

  # ==========================================================
  # PgBouncer Connection Pooler
  # ==========================================================
  pgbouncer:
    image: edoburu/pgbouncer:latest

    container_name: mapmytour_pgbouncer_prod

    environment:
      - DATABASE_URL=postgres://${POSTGRES_PROD_USER}:${POSTGRES_PROD_PASSWORD_URLENCODED}@postgres-prod:5432/${POSTGRES_PROD_DB}

    volumes:
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro

    ports:
      - "0.0.0.0:6432:5432"

    networks:
      - database_network

    depends_on:
      - postgres-prod

    mem_limit: 256m
    cpus: 0.5

    restart: unless-stopped

  # ==========================================================
  # PostgreSQL Exporter
  # ==========================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest

    container_name: mapmytour_postgres_exporter

    command:
      - "--extend.query-path=/etc/postgres_exporter.yml"

    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_PROD_USER}:${POSTGRES_PROD_PASSWORD}@postgres-prod:5432/${POSTGRES_PROD_DB}?sslmode=disable

    ports:
      - "0.0.0.0:9187:9187"

    volumes:
      - ./postgres_exporter.yml:/etc/postgres_exporter.yml:ro

    networks:
      - database_network

    depends_on:
      - postgres-prod

    restart: unless-stopped

  # ==========================================================
  # Redis Exporter
  # ==========================================================
  redis-exporter:
    image: oliver006/redis_exporter:latest

    container_name: mapmytour_redis_exporter

    environment:
      - REDIS_ADDR=redis-prod:6379
      - REDIS_PASSWORD=${REDIS_PROD_PASSWORD}

    ports:
      - "0.0.0.0:9121:9121"

    networks:
      - database_network

    depends_on:
      - redis-prod

    restart: unless-stopped

# ==========================================================
# Networks
# ==========================================================
networks:
  database_network:
    driver: bridge