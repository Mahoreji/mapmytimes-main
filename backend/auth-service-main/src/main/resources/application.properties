# Application Configuration
spring.application.name=auth-service
server.port=8081
# Response Compression - Optimized for Heavy Load
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css
server.compression.min-response-size=512

# Tomcat Thread Pool Configuration - Adaptive for Low to High Load
# Auto-scales from 100 (low load) to 1000 (high load) threads
server.tomcat.threads.max=1000
server.tomcat.threads.min-spare=100
server.tomcat.accept-count=500
server.tomcat.max-connections=20000
server.tomcat.connection-timeout=20000
server.address=${SERVER_ADDRESS:0.0.0.0}
server.forward-headers-strategy=native
app.security.gateway-only.enabled=false

# Error Handling Configuration - Always return JSON, never HTML
server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false

# Enable Spring Retry
spring.retry.enabled=true

# Database Configuration
# Dev-local: H2 in-memory so service can start without external Postgres.
# In production set DATABASE_URL / DATABASE_USERNAME / DATABASE_PASSWORD env vars
# pointing to a real Postgres cluster — env vars take precedence over this file.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:authdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}
# Enable H2 console for local debugging at http://localhost:8081/h2-console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.main.allow-bean-definition-overriding=true

# Enterprise-Grade HikariCP Configuration - Optimized for Performance
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration
# Dev-local H2: create/update schema on startup.
# Production note: when switching to real Postgres behind PgBouncer (transaction-pooling), set ddl-auto=none
# because PgBouncer does not support DatabaseMetaData.getTables() calls Hibernate invokes for 'update'/'validate'.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
# Use H2 auto-dialect for H2 in-memory; real Postgres env sets HIBERNATE_DIALECT explicitly if needed
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.connection.acquisition_timeout=10000
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# AWS S3 Configuration
aws.s3.access-key=${AWS_ACCESS_KEY:}
aws.s3.secret-key=${AWS_SECRET_KEY:}
aws.s3.region=${AWS_REGION:ap-south-1}
aws.s3.bucket-name=${AWS_S3_BUCKET:mapnytimes}

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=20000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000
spring.mail.debug=false

# Gmail SMTP Configuration
app.mail.provider=${APP_MAIL_PROVIDER:zoho}
# Zoho SMTP Configuration
zoho.mail.host=smtp.zoho.in
zoho.mail.port=465
zoho.mail.username=${ZOHO_MAIL_USERNAME:}
zoho.mail.password=${ZOHO_MAIL_PASSWORD:}
zoho.mail.properties.mail.smtp.auth=true
zoho.mail.properties.mail.smtp.ssl.enable=true
zoho.mail.properties.mail.smtp.ssl.trust=smtp.zoho.in
zoho.mail.properties.mail.smtp.connectiontimeout=20000
zoho.mail.properties.mail.smtp.timeout=20000
zoho.mail.properties.mail.smtp.writetimeout=20000

# Twilio Configuration
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.phone-number=${TWILIO_PHONE_NUMBER:}
twilio.whatsapp-number=${TWILIO_WHATSAPP_NUMBER:}

# Redis Configuration for caching and session management
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=0
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=50
spring.data.redis.lettuce.pool.max-idle=20
spring.data.redis.lettuce.pool.min-idle=10

# Logging Configuration
logging.level.in.mapmytour.auth=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate=WARN
logging.level.com.amazonaws=WARN
logging.level.com.twilio=INFO
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.web.socket=DEBUG
# OAuth2 Debug Logging - Enable for troubleshooting OAuth2 issues
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.security.oauth2.client=DEBUG
logging.level.org.springframework.web.client.RestTemplate=DEBUG

# Log file configuration
logging.file.name=logs/auth-service.log
logging.logback.rollingpolicy.file-name-pattern=logs/auth-service-%d{yyyy-MM-dd}.%i.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# Application specific properties
app.name=MapMyTimes
app.version=1.0.0
app.description=Tour Planning and Management System with AI Chatbot
app.timezone=Asia/Kolkata

# CORS Configuration
# Supports both production (www.mapmytimes.com, mapmytimes.com) and staging frontends
app.cors.allowed-origins=https://mapmytimes.com,https://www.mapmytimes.com,https://staging.mapmytimes.com,http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173,http://localhost:5174,http://localhost:5555,https://api.mapmytimes.com,http://localhost:8080,https://*.mapmytimes.com
app.security.content-security-policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"

# JWT Configuration
# Dev-only fallbacks. In production set env vars JWT_SECRET, GATEWAY_JWT_SECRET, JWT_SECRET_KEY to strong 64+ char random values.
# NOTE: Spring Boot auto-prioritises env vars over application.properties — no ${X:default} self-reference pattern needed here (it causes circular placeholder if X= references X in same file).
JWT_SECRET=dev_auth_v2_local_secret_minimum_64_characters_long_0123456789abcdefabcdef0123456789
GATEWAY_JWT_SECRET=dev_gateway_local_secret_minimum_64_characters_long_0123456789abcdefabcdef0123456789
JWT_ISSUER=auth-service

jwt.secret.key=dev_jwt_key_local_secret_minimum_64_characters_long_0123456789abcdefabcdef0123
jwt.secret=${jwt.secret.key}
jwt.expiration=604800000
jwt.issuer=${JWT_ISSUER}
application.supplier-service.url=${SUPPLIER_SERVICE_URL:http://localhost:8093}


# OAuth2 Google Configuration
# NOTE: Set GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET env vars in production to enable real Google sign-in.
#       Dev-local placeholder values are used here only so Spring Boot's non-empty client-id validation passes
#       and the service can start without credentials configured; actual OAuth flow will return an
#       invalid-client error from Google until real values are supplied via environment.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev_google_placeholder_set_GOOGLE_CLIENT_ID_env_var_to_enable}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev_google_secret_placeholder}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH2_REDIRECT_URI:https://api.mapmytimes.com/oauth2/callback/{registrationId}}
spring.security.oauth2.client.registration.google.client-name=Google
spring.security.oauth2.client.registration.google.provider=google

# OAuth2 Facebook Configuration
# NOTE: Set FACEBOOK_CLIENT_ID + FACEBOOK_CLIENT_SECRET env vars in production to enable real Facebook sign-in.
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:dev_facebook_placeholder_set_FACEBOOK_CLIENT_ID_env_var_to_enable}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:dev_facebook_secret_placeholder}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri=${OAUTH2_REDIRECT_URI:https://api.mapmytimes.com/oauth2/callback/{registrationId}}
spring.security.oauth2.client.registration.facebook.client-name=Facebook

# Facebook Provider Configuration
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v18.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.token-uri=https://graph.facebook.com/v18.0/oauth/access_token
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/v18.0/me?fields=id,first_name,last_name,name,email,picture.type(large)
spring.security.oauth2.client.provider.facebook.user-name-attribute=id

# App Configuration
app.frontend.url=${FRONTEND_URL:https://www.mapmytimes.com}
# Supported frontend URLs for OAuth2 redirects (comma-separated) - includes local 3000/3001/5173 (Next.js dev/prod + Flutter PWA)
app.oauth2.allowed-redirect-uris=https://www.mapmytimes.com/auth/oauth2/redirect,https://staging.mapmytimes.com/auth/oauth2/redirect,https://mapmytimes.com/auth/oauth2/redirect,https://www.mapmytimes.com/auth/oauth2/redirect,https://mapmytimes.com/auth/oauth2/redirect,https://staging.mapmytimes.com/auth/oauth2/redirect,http://localhost:3000/auth/oauth2/redirect,http://localhost:3001/auth/oauth2/redirect,http://localhost:5173/auth/oauth2/redirect

# OAuth2 base URL for building Spring Security authorization endpoints.
# Default = LOCAL DEV (auth-service direct port 8081) so `./mvnw spring-boot:run` works immediately
# out-of-the-box for local Google/Facebook OAuth flows. Production MUST override via env var:
#     export APP_OAUTH2_BASE_URL=https://api.mapmytimes.com
app.oauth2.base-url=${APP_OAUTH2_BASE_URL:http://localhost:8081}
# OAuth2 Cookie Configuration
app.oauth2.cookie.secure=${OAUTH2_COOKIE_SECURE:true}


# API Rate Limiting
app.rate-limit.requests-per-minute=200

# Cache Configuration
# Dev-local: use simple in-memory (ConcurrentHashMap) cache so service can start without a Redis server.
# In production set SPRING_CACHE_TYPE=redis and provide REDIS_HOST / REDIS_PORT / REDIS_PASSWORD env vars.
spring.cache.type=${SPRING_CACHE_TYPE:simple}
# Disable Hibernate Query Cache and Second-Level Cache
# Both are disabled to avoid RegionFactory configuration requirements
# Spring Cache (simple/redis) is still active for @Cacheable annotations
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.provider_class=org.hibernate.cache.internal.NoCachingRegionFactory
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false

# Async Configuration
spring.task.execution.pool.core-size=20
spring.task.execution.pool.max-size=500
spring.task.execution.pool.queue-capacity=1000
spring.task.execution.thread-name-prefix=mapmytimes-async-

# Management and Monitoring
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# Trip circles & daily actions configuration
mmt.circles.maxCirclesPerDay=5
mmt.circles.maxPostsPerHour=30
mmt.circles.maxPollsPerDay=10
mmt.circles.dedupActionPerDay=true
mmt.circles.attributionLookbackDays=7

# ==================== KAFKA MESSAGE QUEUE CONFIGURATION ====================
# spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
# Kafka Bootstrap Servers
# KAFKA_BOOTSTRAP_SERVERS env var overrides this:
#   - Docker Compose deployment : KAFKA_BOOTSTRAP_SERVERS=kafka:9092  (service name on same network)
#   - Local / outside Docker    : KAFKA_BOOTSTRAP_SERVERS=localhost:9092 (or real host:port)
# Default is localhost:9092 so the service can start without a Kafka daemon — failures are non-blocking.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=${spring.application.name}-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.batch-size=16384
spring.kafka.producer.buffer-memory=33554432
# Kafka connection timeout settings (prevent blocking when Kafka is unavailable)
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.max.block.ms=1000
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.concurrency=3

# Profile-specific banner
spring.banner.location=classpath:banner.txt

# Connection Keep-Alive for Performance
server.tomcat.keep-alive-timeout=60000
server.tomcat.max-keep-alive-requests=100

# External Services Integration
app.external.notification-service.url=http://notification-service:9090



