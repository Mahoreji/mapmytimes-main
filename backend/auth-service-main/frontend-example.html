<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Real-Time Example</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
</head>
<body>
    <h1>Real-Time Communication Test</h1>
    <div id="status">Connecting...</div>
    <div id="messages"></div>
    <div id="notifications"></div>
    
    <input type="text" id="messageInput" placeholder="Type message...">
    <button onclick="sendMessage()">Send</button>

    <script>
        const token = 'YOUR_ACCESS_TOKEN_HERE'; // Replace with your token
        const socket = new SockJS('http://localhost:8081/ws');
        const client = new StompJs.Client({
            webSocketFactory: () => socket,
            connectHeaders: {
                Authorization: 'Bearer ' + token
            },
            onConnect: () => {
                document.getElementById('status').textContent = '✅ Connected';
                subscribe();
            },
            onStompError: (frame) => {
                console.error('Error:', frame);
                document.getElementById('status').textContent = '❌ Error: ' + frame.headers['message'];
            }
        });

        function subscribe() {
            // Messages
            client.subscribe('/user/queue/messages', (message) => {
                const msg = JSON.parse(message.body);
                const div = document.createElement('div');
                div.textContent = '📨 ' + msg.message;
                document.getElementById('messages').appendChild(div);
            });

            // Notifications
            client.subscribe('/user/queue/notifications', (notification) => {
                const notif = JSON.parse(notification.body);
                const div = document.createElement('div');
                div.textContent = '🔔 ' + notif.title + ': ' + notif.message;
                document.getElementById('notifications').appendChild(div);
            });

            // Presence
            client.subscribe('/user/queue/presence', (presence) => {
                const pres = JSON.parse(presence.body);
                console.log('👤 Presence:', pres);
            });
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value;
            
            fetch('http://localhost:8081/api/v1/user/messages/direct', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({
                    recipientEmail: 'recipient@example.com',
                    message: message,
                    messageType: 'TEXT'
                })
            }).then(() => {
                input.value = '';
                console.log('Message sent! Will arrive via WebSocket automatically.');
            });
        }

        client.activate();
    </script>
</body>
</html>
