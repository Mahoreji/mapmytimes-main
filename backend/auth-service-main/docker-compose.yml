# ==============================================================================
# MapMyTour Auth Service — Docker Compose
# ==============================================================================
# Both auth-service and kafka share the "auth-service-network" bridge so that
# the hostname "kafka" resolves correctly inside the auth-service container.
#
# Environment variable priority for Kafka:
#   1. KAFKA_BOOTSTRAP_SERVERS set here  → uses Docker service name "kafka:9092"
#   2. application.properties default   → localhost:9092  (for local/non-Docker runs)
# ==============================================================================

version: '3.8'

services:

  # ---------------------------------------------------------------------------
  # Zookeeper (required by Kafka)
  # ---------------------------------------------------------------------------
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: auth-service-zookeeper
    networks:
      - auth-service-network
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: [ "CMD-SHELL", "echo ruok | nc -q 1 localhost 2181 | grep imok" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Kafka broker
  # The service name MUST be "kafka" so auth-service can resolve it via DNS.
  # ---------------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: auth-service-kafka
    networks:
      - auth-service-network
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "127.0.0.1:9092:9092"        # expose to host for local tooling only
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # INSIDE the Docker network use service name; OUTSIDE (host tools) use localhost
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Auth Service application
  # ---------------------------------------------------------------------------
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: mapmytour/auth-service:latest
    container_name: auth-service
    networks:
      - auth-service-network
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SERVER_PORT: 8081
      SERVER_ADDRESS: 0.0.0.0
      SPRING_PROFILES_ACTIVE: prod

      # ---- Kafka: use Docker service name so DNS resolves correctly ----
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # SPRING_KAFKA_BOOTSTRAP_SERVERS is the official Spring env key override
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      # ---- Override other env vars via .env or explicit values below ----
      # DATABASE_URL, JWT_SECRET, REDIS_*, AWS_*, etc. should come from .env
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/api/v1/auth/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

# ------------------------------------------------------------------------------
networks:
  auth-service-network:
    driver: bridge
    name: auth-service-network
