# Application Configuration
spring.application.name=customer-support-service
server.port=${SERVER_PORT:8086}
server.address=${SERVER_ADDRESS:0.0.0.0}
app.security.gateway-only.enabled=true

# Response Compression - Optimized for Heavy Load
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css,application/octet-stream
server.compression.min-response-size=512

# Server Error Handling
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=true

# Database Configuration
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.main.allow-bean-definition-overriding=true

# Enterprise-Grade HikariCP Configuration - Optimized for Testing + Production
# Balanced pool size: enough for testing, safe for production
# Scales from 2 (low) to 8 (heavy load) - optimized for endpoint testing
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.register-mbeans=true
# Performance optimizations - HikariCP auto-scales between min-idle and max-pool-size
spring.datasource.hikari.connection-init-sql=SELECT 1
spring.datasource.hikari.isolate-internal-queries=false
# Additional optimizations for testing
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.pool-name=CustomerSupportHikariPool

# JPA Configuration - Production Ready
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=never

# Flyway Database Migration Configuration
# Disabled by default - enable if you have Flyway migrations in src/main/resources/db/migration
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# Hibernate Cache Configuration - Using Spring Cache with Redis
# Note: Hibernate second-level cache disabled - using Spring Cache (@Cacheable) with Redis instead
# This avoids JCache dependency issues and provides better integration with Spring Cache
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Performance Configuration - Ultra-Fast Response Optimized
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=128

# Redis Configuration - Ultra-Fast Response + Adaptive Load Handling
# Scales from 20 (low load) to 200 (heavy load) connections
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=0
spring.data.redis.timeout=1000ms
spring.data.redis.lettuce.pool.max-active=200
spring.data.redis.lettuce.pool.max-idle=100
spring.data.redis.lettuce.pool.min-idle=20
spring.data.redis.lettuce.pool.max-wait=500ms
spring.data.redis.lettuce.shutdown-timeout=100ms
spring.data.redis.lettuce.cluster.refresh.adaptive=true
spring.data.redis.lettuce.cluster.refresh.period=30s
spring.data.redis.repositories.enabled=false
# Lettuce pool auto-scales between min-idle and max-active based on demand

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
spring.servlet.multipart.file-size-threshold=2KB

# AWS S3 Configuration
aws.s3.enabled=true
aws.s3.access-key=${AWS_ACCESS_KEY}
aws.s3.secret-key=${AWS_SECRET_KEY}
aws.s3.region=${AWS_REGION:ap-south-1}
aws.s3.bucket-name=${AWS_S3_BUCKET:mapmytour-bucket-prod}

# AWS S3 Timeout Configuration - Increased for better reliability
aws.s3.connection-timeout=300000
aws.s3.socket-timeout=300000
aws.s3.max-connections=50
aws.s3.retry-max-attempts=5
aws.s3.retry-delay=2000

# Logging Configuration - Optimized for Performance
logging.level.root=WARN
logging.level.in.mapmytour.customer=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.transaction=WARN
logging.level.org.springframework.orm.jpa=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.hibernate.engine.transaction=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.com.amazonaws=WARN
logging.level.com.twilio=INFO
logging.level.org.springframework.ai=DEBUG
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.web.socket=DEBUG

# Log file configuration
logging.file.name=logs/customer-support-service.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Logback rolling policy
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
logging.logback.rollingpolicy.file-name-pattern=logs/customer-support-service-%d{yyyy-MM-dd}.%i.log

# Application specific properties
app.name=customer-support-service
app.version=1.0.0
app.description=Tour Planning and Management System with AI Chatbot
app.timezone=Asia/Kolkata

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:4200,https://mapmytour-master.vercel.app,https://mapmytimes.com,https://www.mapmytimes.com,https://*.mapmytimes.com
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=*
app.cors.allow-credentials=true

# Jackson Configuration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.deserialization.accept-empty-string-as-null-object=true
spring.jackson.deserialization.accept-single-value-as-array=true

# Cache Configuration - Ultra-Fast Response Optimized
# Using Spring Cache with Redis (not Hibernate's second-level cache)
# Use @Cacheable annotations in service methods for caching
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=cache:
spring.cache.redis.use-key-prefix=true

# Management and Monitoring - Production-ready
management.endpoints.web.exposure.include=health,info,metrics,hikaricp,prometheus,circuitbreakers,circuitbreakerevents
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.circuitbreakers.enabled=true
management.health.redis.enabled=true
management.health.db.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.export.prometheus.enabled=true

# Tomcat Thread Pool Configuration - Ultra-Fast + Adaptive Load Handling
# Pre-warmed threads (50) for instant response, scales up to 2000 for heavy load
# Auto-scales from 50 (low load) to 2000 (heavy load) threads
# Tomcat Configuration - Optimized for Testing + Production
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
server.tomcat.accept-count=100
server.tomcat.max-connections=20000
# Tomcat Connection Timeout - Increased for better reliability during testing
server.tomcat.connection-timeout=30000
server.tomcat.keep-alive-timeout=60000
server.tomcat.max-keep-alive-requests=100
server.tomcat.processor-cache=200
# Enable NIO2 for better performance - Tomcat auto-scales threads based on queue depth

# Async Task Execution Pool - Adaptive for Low to High Load
# Auto-scales from 20 (low load) to 500 (high load) threads
spring.task.execution.pool.core-size=20
spring.task.execution.pool.max-size=500
spring.task.execution.pool.queue-capacity=2000
spring.task.execution.thread-name-prefix=customer-support-async-
# Adaptive async pool - Spring automatically scales threads based on queue depth
spring.task.execution.pool.keep-alive=60s

# Redis Connection Pool - Optimized for Heavy Load (configured above in Redis Configuration section)

# Production specific configurations for testing
app.auto-repair.enabled=true
app.circuit-breaker.enabled=true
app.error-recovery.enabled=true
app.auto-healing.enabled=true
app.durability.enabled=true
app.monitoring.enabled=true

# Adaptive Load Management - Auto-scaling from Low to High Load
# Optimized for ultra-fast response (< 500ms) while handling heavy load
app.adaptive-load-management.enabled=true
app.adaptive-load-management.low-load-threshold=100
app.adaptive-load-management.medium-load-threshold=1000
app.adaptive-load-management.high-load-threshold=10000
app.adaptive-load-management.auto-scale.enabled=true
app.adaptive-load-management.auto-scale.min-connections=15
app.adaptive-load-management.auto-scale.max-connections=100
app.adaptive-load-management.auto-scale.min-threads=50
app.adaptive-load-management.auto-scale.max-threads=2000
# Response time target: < 500ms for all load levels
app.adaptive-load-management.target-response-time-ms=500

# JWT Token Authentication - Production Configuration
jwt.validation.mode=production
jwt.secret.key=${JWT_SECRET_KEY}
jwt.validation.skip-signature=false
jwt.issuer=auth-service
jwt.audience=api-gateway
jwt.algorithm=HS256

# ==================== SERVICE DISCOVERY (EUREKA) CONFIGURATION ====================
# Enable Eureka Client for Service Discovery
# Eureka is disabled by default - services work without it using direct URLs
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://eureka-server:8761/eureka}
eureka.client.enabled=${EUREKA_CLIENT_ENABLED:false}
eureka.client.register-with-eureka=${EUREKA_REGISTER:false}
eureka.client.fetch-registry=${EUREKA_FETCH:false}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance-id:${random.value}}
eureka.client.healthcheck.enabled=true
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# ==================== MICROSERVICE INTEGRATION CONFIGURATION ====================
# Service URLs for inter-service communication
# Production: Uses Docker container names for service discovery
# Local Development: Override with environment variables (e.g., BOOKING_SERVICE_URL=http://localhost:8089)
booking.service.url=${BOOKING_SERVICE_URL:http://booking-service:8089}
core.service.url=${CORE_SERVICE_URL:http://core-service:8083}
agent.service.url=${AGENT_SERVICE_URL:http://agent-service:8103}
auth.service.url=${AUTH_SERVICE_URL:http://auth-service:8081}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://notification-service:9090}
payment.service.url=${PAYMENT_SERVICE_URL:http://payment-service:8088}

# API Gateway Configuration
# Production: Uses Docker container name for service discovery
# Local Development: Override with environment variable (e.g., API_GATEWAY_URL=http://localhost:8080)
api.gateway.url=${API_GATEWAY_URL:http://api-gateway-service:8080}
api.gateway.enabled=${API_GATEWAY_ENABLED:true}

# ==================== CIRCUIT BREAKER CONFIGURATION (Resilience4j) ====================
# Circuit Breaker for external service calls
resilience4j.circuitbreaker.instances.bookingService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.bookingService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.bookingService.sliding-window-size=10
resilience4j.circuitbreaker.instances.bookingService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.bookingService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.bookingService.automatic-transition-from-open-to-half-open-enabled=true

# Retry Configuration
resilience4j.retry.instances.bookingService.max-attempts=3
resilience4j.retry.instances.bookingService.wait-duration=1s
resilience4j.retry.instances.bookingService.retry-exceptions=java.net.ConnectException,java.net.SocketTimeoutException,org.springframework.web.client.ResourceAccessException

# Time Limiter Configuration
resilience4j.timelimiter.instances.bookingService.timeout-duration=5s
resilience4j.timelimiter.instances.bookingService.cancel-running-future=true

# ==================== KAFKA MESSAGE QUEUE CONFIGURATION ====================
# Kafka Bootstrap Servers
# Production: Uses Docker container name for service discovery
# Local Development: Override with environment variable (e.g., KAFKA_BOOTSTRAP_SERVERS=localhost:9092)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.group-id=${spring.application.name}-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3
spring.kafka.producer.batch-size=16384
spring.kafka.producer.buffer-memory=33554432
# Kafka connection timeout settings (prevent blocking when Kafka is unavailable)
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.producer.properties.max.block.ms=1000
spring.kafka.listener.ack-mode=manual_immediate
spring.kafka.listener.concurrency=3

# Profile-specific banner
spring.banner.location=classpath:banner.txt

# Connection Keep-Alive for Performance (configured above in Tomcat Thread Pool Configuration section)
