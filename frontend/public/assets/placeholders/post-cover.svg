    <text x="0" y="280" font-family="Arial Black, sans-serif" font-size="44" fill="#ffffff" letter-spacing="12" opacity="0.95">JOURNALISM OF INTEGRITY</text>
  </g>
  <rect x="60" y="60" width="1480" height="780" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.25" stroke-dasharray="20 12"/>
