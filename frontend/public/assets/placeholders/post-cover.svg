    <radialGradient id="h" cx="30%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#E31E24" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.9"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#p)"/>
