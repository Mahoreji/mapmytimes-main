<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" width="1600" height="900">
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0000"/>
      <stop offset="50%" stop-color="#3a0608"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <pattern id="n" width="100" height="100" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="100" height="100" fill="transparent"/>
      <line x1="0" y1="0" x2="0" y2="100" stroke="#E31E24" stroke-width="1.5" opacity="0.16"/>
