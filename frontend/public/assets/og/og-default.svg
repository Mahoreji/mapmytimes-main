    <text x="0" y="150" font-family="Arial Black, sans-serif" font-size="160" font-weight="900" fill="#E31E24" letter-spacing="-6">MY TIMES</text>
    <rect x="0" y="190" width="760" height="10" fill="#E31E24"/>
    <text x="0" y="270" font-family="Arial Black, sans-serif" font-size="46" fill="#ffffff" letter-spacing="10" opacity="0.9">JOURNALISM OF INTEGRITY</text>
  </g>
  <rect x="80" y="80" width="1040" height="470" fill="none" stroke="#E31E24" stroke-width="6"/>
